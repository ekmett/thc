name: Build
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: '9.14.1'
          cabal-update: false
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          version: '25.3.4.1'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-for-updates: false
      - name: Verify pinned toolchain
        shell: bash
        run: |
          test "$(ghc --numeric-version)" = 9.14.1
          test "$(ghc-pkg --version)" = 'GHC package manager version 9.14.1'
          python3 - <<'PY'
          import os
          from pathlib import Path
          release = dict(line.split('=', 1) for line in (Path(os.environ['JAVA_HOME']) / 'release').read_text().splitlines() if '=' in line)
          assert release['GRAALVM_VERSION'].strip('"') == '25.3.4.1', release.get('GRAALVM_VERSION')
          assert release['JAVA_VERSION'].strip('"').split('.')[0] == '25', release.get('JAVA_VERSION')
          PY
          java --version
      - name: Build and test from source
        run: scripts/try.sh
      - name: Require fresh native SIMD oracle and post-Tidy export on x86
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('build/simd/provenance.json').read_text())
          assert proof['nativeRows'] == 147 and proof['stages'] == ['pre', 'post'], proof
          PY
      - name: Test opt-in dense handoff
        env:
          JAVA_TOOL_OPTIONS: -Dthc.handoffSlabs=true
        run: |
          scripts/gradle.sh --no-daemon test --rerun-tasks
          cp -R build/test-results/test build/test-results/handoff
          cp -R build/reports/tests/test build/reports/tests/handoff
      - name: Check real IntMap and the explicit Set frontier
        shell: bash
        run: |
          python3 scripts/prepare-library-tests.py
          for backend in ast bytecode; do
            java --enable-native-access=ALL-UNNAMED -Xss2m -XX:+UseCompactObjectHeaders \
              -cp 'build/install/thc/lib/*' thc.LibraryCheckKt build/libraries/cases.json "$backend" \
              2>&1 | tee "build/libraries/check-$backend.log"
          done
          java --enable-native-access=ALL-UNNAMED -Xss2m -XX:+UseCompactObjectHeaders \
            -Dthc.handoffSlabs=true -cp 'build/install/thc/lib/*' \
            thc.LibraryCheckKt build/libraries/cases.json ast \
            2>&1 | tee build/libraries/check-handoff-ast.log
      - name: Check exact dependency auditor and library frontier
        run: |
          python3 scripts/test-audit-core.py
          python3 scripts/test-library-frontier.py
          python3 scripts/test-core-vectors.py
          python3 scripts/test-primop-coverage.py
      - name: Check benchmark power provenance
        run: python3 tools/test-compare-map-runtimes.py
      - name: Run ordinary Map workload with explicit unsupported-path traps
        env:
          THC_DIAGNOSTIC_UNSUPPORTED: 'true'
        run: scripts/try-map.sh
      - name: Check Map through the AST backend
        shell: bash
        run: |
          java --enable-native-access=ALL-UNNAMED -Xss2m -XX:+UseCompactObjectHeaders \
            -Dthc.backend=ast -Dthc.diagnosticUnsupported=true -Dthc.traceCompilation=true \
            -cp 'build/install/thc/lib/*' thc.MapCheckKt build/map/modules.txt build/map/oracle.tsv \
            2>&1 | tee build/map/check-ast.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results-${{ runner.os }}
          path: |
            build/reports/tests/
            build/test-results/
            build/aggregate-frontier.json
            build/primop-coverage.json
            build/aggregate-native/oracle.tsv
            build/aggregate-layout/
            build/tuple-return/
            build/tuple-join/
            build/tuple-arithmetic/
            build/integer-primops/manifest.json
            build/integer-primops/oracle.tsv
            build/integer-primops/*.audit.json
            build/simd/
            build/signed-narrow-primops/manifest.json
            build/signed-narrow-primops/oracle.tsv
            build/signed-narrow-primops/*.audit.json
            build/corpus/corpus.json
            build/corpus/oracle.tsv
            build/corpus/structure.json
            build/corpus/groups/**/*.audit.json
            build/corpus/groups/**/boot-provenance.json
            build/libraries/cases.json
            build/libraries/oracle.tsv
            build/libraries/oracle-validation.json
            build/libraries/check-*.log
            build/libraries/*/audit.json
            build/libraries/*/provenance.json
            build/map/audit.json
            build/map/check.log
            build/map/check-ast.log
            build/map/provenance.json
            build/map/reproduction-provenance.json
