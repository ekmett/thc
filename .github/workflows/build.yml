name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit expected by the merge bot (empty for a manual run)
        type: string
        required: false

concurrency:
  # Finish the running main check, then check the newest pending revision.
  # A shared group keeps rapid merges from starting a full build per commit;
  # the default single pending slot replaces revisions that have not started.
  group: build-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test merge decisions and race handling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Lint CI and merge workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-max-time 30 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # GitHub supports queue: max; the pinned linter does not yet know this key.
          "$RUNNER_TEMP/actionlint" -ignore '^unexpected key "queue" for "concurrency" section\.'
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.0.0'
          cabal-update: true
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          version: '25.3.4.1'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-for-updates: false
      - name: Verify pinned toolchain
        shell: bash
        run: |
          test "$(ghc --numeric-version)" = 9.14.1
          test "$(ghc-pkg --version)" = 'GHC package manager version 9.14.1'
          case "$(cabal --numeric-version)" in 3.16.*) ;; *) exit 1 ;; esac
          python3 - <<'PY'
          import os
          from pathlib import Path
          release = dict(line.split('=', 1) for line in (Path(os.environ['JAVA_HOME']) / 'release').read_text().splitlines() if '=' in line)
          assert release['GRAALVM_VERSION'].strip('"') == '25.3.4.1', release.get('GRAALVM_VERSION')
          assert release['JAVA_VERSION'].strip('"').split('.')[0] == '25', release.get('JAVA_VERSION')
          PY
          java --version
      - name: Check the primop checklist
        run: python3 scripts/primop-coverage.py --check
      - name: Resolve Cabal driver dependencies
        run: cabal build exe:thc
      - name: Install Linux native and LLVM build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 llvm-18 libgmp-dev
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Check Linux LLVM backend tools
        if: runner.os == 'Linux'
        run: |
          for tool in clang llc opt; do
            command -v "$tool"
            major=$("$tool" --version | sed -nE 's/.*version ([0-9]+).*/\1/p' | sed -n '1p')
            test "$major" = 18
          done
      - name: Build and test from source
        run: scripts/try.sh --fail-fast
      - name: Check Haskell calls into JavaScript
        run: |
          python3 scripts/test-polyglot-audit.py
          python3 -O scripts/test-polyglot-audit.py
          scripts/polyglot-demo.sh
          python3 compiler/test-javascript-ffi.py
          scripts/javascript-demo.sh
          ./gradlew polyglotTest
      - name: Build and exercise the Cabal driver
        shell: bash
        run: |
          set -euo pipefail
          cabal build exe:thc --offline -fdevelopment
          cabal run thc --offline -fdevelopment -- --help
          cabal test driver-tests -fdevelopment --test-show-details=direct
      - name: Check registered cross-package Core on both compiled backends
        run: python3 scripts/test-core-package-link.py
      - name: Preserve default test results
        if: always()
        shell: bash
        run: |
          if [ -d build/test-results/test ]; then cp -R build/test-results/test build/test-results/default; fi
          if [ -d build/reports/tests/test ]; then cp -R build/reports/tests/test build/reports/tests/default; fi
      - name: Require fresh native SIMD oracle and post-Tidy export on x86
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('build/simd/provenance.json').read_text())
          assert proof['nativeRows'] == 147 and proof['stages'] == ['pre', 'post'], proof
          proof = json.loads(Path('build/simd-int32x4/provenance.json').read_text())
          assert proof['nativeRows'] == 243 and proof['stages'] == ['pre', 'post'], proof
          proof = json.loads(Path('build/simd-floatx4/provenance.json').read_text())
          assert proof['nativeRows'] == 2196 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-doublex2/provenance.json').read_text())
          assert proof['nativeRows'] == 3390 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-int16x8/provenance.json').read_text())
          assert proof['nativeRows'] == 6032 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-int8x16/provenance.json').read_text())
          assert proof['nativeRows'] == 9168 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-word8x16/provenance.json').read_text())
          assert proof['nativeRows'] == 7712 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-word16x8/provenance.json').read_text())
          assert proof['nativeRows'] == 5116 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-word32x4/provenance.json').read_text())
          assert proof['nativeRows'] == 4882 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-int32x4-multiply/provenance.json').read_text())
          assert proof['nativeRows'] == 1722 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-int32x4-bytearray/provenance.json').read_text())
          assert proof['nativeRows'] == 9666 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-word32x4-bytearray/provenance.json').read_text())
          assert proof['nativeRows'] == 9666 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-floatx4-bytearray/provenance.json').read_text())
          assert proof['nativeRows'] == 6720 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-doublex2-bytearray/provenance.json').read_text())
          assert proof['nativeRows'] == 4384 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          PY
      - name: Test opt-in dense handoff
        env:
          JAVA_TOOL_OPTIONS: -Dthc.handoffSlabs=true
        run: |
          ./gradlew --no-daemon test --rerun
          cp -R build/test-results/test build/test-results/handoff
          cp -R build/reports/tests/test build/reports/tests/handoff
      - name: Prepare fresh library source and native oracles
        run: python3 scripts/prepare-library-tests.py
      - name: Package verified library inputs and installed runtime
        run: python3 .github/scripts/library_bundle.py pack --output build/library-transfer.tar.gz
      - name: Share this platform's library inputs with this Build attempt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: library-inputs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/library-transfer.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Check exact dependency auditor and library frontier
        run: |
          python3 scripts/test-audit-core.py
          python3 scripts/test-plugin.py
          python3 scripts/test-core-enums.py
          python3 scripts/test-sum-layout.py
          python3 scripts/test-core-sums.py
          python3 scripts/test-tuple-inputs.py
          python3 scripts/test-empty-join-inputs.py
          python3 scripts/test-library-frontier.py
          python3 scripts/test-sequence-model.py
          python3 scripts/test-core-vectors.py
          python3 scripts/test-simd-families.py
          python3 scripts/test-floatx4-model.py
          python3 scripts/test-doublex2-model.py
          python3 scripts/test-int16x8-model.py
          python3 scripts/test-int8x16-model.py
          python3 scripts/test-word8x16-model.py
          python3 scripts/test-word16x8-model.py
          python3 scripts/test-word32x4-model.py
          python3 scripts/test-int32x4-multiply-model.py
          python3 scripts/test-int32x4-bytearray-model.py
          python3 scripts/test-core-vector-memory.py
          python3 scripts/test-word32x4-bytearray-model.py
          python3 scripts/test-core-word32-vector-memory.py
          python3 scripts/test-floatx4-bytearray-model.py
          python3 scripts/test-core-float-vector-memory.py
          python3 scripts/test-doublex2-bytearray-model.py
          python3 scripts/test-core-double-vector-memory.py
          python3 scripts/test-core-bytearrays.py
          python3 scripts/test-core-arrays.py
          python3 scripts/test-address-fields.py
          python3 scripts/test-core-data-tags.py
          python3 scripts/test-show-int-model.py
          python3 scripts/test-show-word-list-model.py
          python3 scripts/test-narrow-literal-proofs.py
          python3 scripts/test-short-bytes-slices-model.py
          python3 scripts/test-array-slice-model.py
          python3 scripts/test-mutable-bytearray-model.py
          python3 scripts/test-primop-coverage.py
      - name: Check merged fixture and runtime recipes with and without assertions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            scripts/test-build-cbits.py \
            scripts/test-core-managed-memory.py \
            scripts/test-core-managed-files.py \
            scripts/test-core-md5-foreign.py \
            scripts/test-core-package-manifest.py \
            scripts/test-managed-mvar-fixtures.py \
            scripts/test-managed-mvars.py \
            scripts/test-pinned-addresses.py \
            scripts/test-prepare-managed-md5.py \
            scripts/test-putstrln-export.py \
            scripts/test-synchronous-exception-fixtures.py; do
            python3 "$test"
            python3 -O "$test"
          done
      - name: Check benchmark power provenance
        run: python3 tools/test-compare-map-runtimes.py
      - name: Prepare fresh Map source and native oracle
        env:
          THC_DIAGNOSTIC_UNSUPPORTED: 'true'
        run: scripts/prepare-map.sh
      - name: Check diagnostic Map on both backends and handoff modes
        shell: bash
        run: |
          set -euo pipefail
          matrix_status=0
          for handoff in false true; do
            for backend in ast bytecode; do
              java --enable-native-access=ALL-UNNAMED -Xss2m -XX:+UseCompactObjectHeaders \
                "-Dthc.backend=$backend" "-Dthc.handoffSlabs=$handoff" \
                -Dthc.diagnosticUnsupported=true -Dthc.traceCompilation=true \
                -cp 'build/install/thc/lib/*:build/diagnostics/thc-tools.jar' thc.MapCheckKt build/map/modules.txt build/map/oracle.tsv \
                2>&1 | tee "build/map/check-$backend-handoff-$handoff.log" || matrix_status=1
            done
          done
          exit "$matrix_status"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
