  foreign-exceptions:
    # Complete original Core is provisioned on this trusted runner. Keep this a
    # required Build job; stock hosted tests cannot replace these program lanes.
    runs-on: [self-hosted, Linux, X64, thc-fast]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: work/foreign-exceptions
    env:
      THC_FULL_CORE_ENVIRONMENT: ${{ vars.THC_FULL_CORE_ENVIRONMENT }}
    steps:
      - name: Require a trusted repository branch
        working-directory: .
        run: |
          test "$GITHUB_EVENT_NAME" = push || test "$GITHUB_EVENT_NAME" = workflow_dispatch
          case "$GITHUB_REF" in refs/heads/*) ;; *) exit 1 ;; esac
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$GITHUB_REF" = refs/heads/main; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          path: work/foreign-exceptions
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Prepare genuine exception support and test both handoff modes
        run: |
          set -euo pipefail
          test -n "$THC_FULL_CORE_ENVIRONMENT" && test -f "$THC_FULL_CORE_ENVIRONMENT"
          # shellcheck source=/dev/null
          source "$THC_FULL_CORE_ENVIRONMENT"
          test -n "${THC_FOREIGN_EXCEPTION_GHC_SOURCE:-}" && test -d "$THC_FOREIGN_EXCEPTION_GHC_SOURCE"
          test "$("$GHC" --numeric-version)" = 9.14.1
          test "$("$GHC_PKG" --version)" = 'GHC package manager version 9.14.1'
          # Never share mutable Gradle/THC acquisition caches with Fast checks or
          # development worktrees, even if the provisioned environment sets them.
          export GRADLE_USER_HOME="$RUNNER_TEMP/thc-foreign-exceptions/gradle"
          export THC_GRADLE_USER_HOME="$GRADLE_USER_HOME"
          export THC_CACHE_HOME="$RUNNER_TEMP/thc-foreign-exceptions/core"
          make foreign-exception-test-modes GRADLE_FLAGS='--no-daemon --max-workers=2'
      - name: Retain portable source and artifact hashes
        if: always()
        run: |
          if [ -f build/foreign-exceptions/manifest.json ]; then
            mkdir -p build/foreign-exception-ci
            node <<'JS'
          const fs = require('fs');
          const {schema, ghc, entries, inputHashes, artifactHashes} =
            JSON.parse(fs.readFileSync('build/foreign-exceptions/manifest.json', 'utf8'));
          fs.writeFileSync('build/foreign-exception-ci/provenance.json',
            JSON.stringify({schema, ghc, entries, inputHashes, artifactHashes}, null, 2) + '\n');
          JS
          fi
      - name: Preserve genuine exception correctness results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foreign-exception-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/foreign-exceptions/build/foreign-exception-ci/provenance.json
            work/foreign-exceptions/build/test-results/foreignExceptionTest/*.xml
            work/foreign-exceptions/build/test-results/foreignExceptionDenseTest/*.xml
            work/foreign-exceptions/build/foreign-exceptions/logs/native-oracle.stdout
          if-no-files-found: warn
          retention-days: 14

  library:
    name: library (${{ matrix.os }}, ${{ matrix.backend }}, handoff=${{ matrix.handoff }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [ast, bytecode]
        handoff: ['false', 'true']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          version: '25.3.4.1'
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-for-updates: false
      - name: Download only this platform and Build attempt
        uses: actions/download-artifact@v8
        with:
          name: library-inputs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/library-download
          digest-mismatch: error
      - name: Verify source, platform, pinned JDK and original library fingerprints
        run: python3 .github/scripts/library_bundle.py restore --archive build/library-download/library-transfer.tar.gz
      - name: Run the complete strict and compiled library checks
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          HANDOFF: ${{ matrix.handoff }}
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED -Xss2m -XX:+UseCompactObjectHeaders \
            "-Dthc.handoffSlabs=$HANDOFF" -cp 'build/install/thc/lib/*:build/diagnostics/thc-tools.jar' \
            thc.LibraryCheck build/libraries/cases.json "$BACKEND" \
            2>&1 | tee "build/libraries/check-$BACKEND-handoff-$HANDOFF.log"
      - name: Preserve each library mode's results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: library-results-${{ runner.os }}-${{ matrix.backend }}-handoff-${{ matrix.handoff }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/library-transfer-verified.json
            build/libraries/check-*.log
