name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit expected by the merge bot (empty for a manual run)
        type: string
        required: false

concurrency:
  # Finish the running main check, then check the newest pending revision.
  # A shared group keeps rapid merges from starting a full build per commit;
  # the default single pending slot replaces revisions that have not started.
  group: build-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test merge decisions and race handling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Lint CI and merge workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-max-time 30 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # GitHub supports queue: max; the pinned linter does not yet know this key.
          "$RUNNER_TEMP/actionlint" -ignore '^unexpected key "queue" for "concurrency" section\.'
  jvm-linux:
    name: Linux ordinary tests
    uses: ./.github/workflows/test-groups.yml
    with:
      os: ubuntu-latest
      expected_sha: ${{ inputs.expected_sha }}
  jvm-macos:
    name: macOS ordinary tests
    uses: ./.github/workflows/test-groups.yml
    with:
      os: macos-latest
      expected_sha: ${{ inputs.expected_sha }}
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Cold native/Core preparation and both fresh JVM forks share this budget.
    # Allow the complete matrix to finish; individual compiler limits remain unchanged.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.0.0'
          cabal-update: true
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          version: '25.3.4.1'
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-for-updates: false
      - name: Verify pinned toolchain
        shell: bash
        run: |
          test "$(ghc --numeric-version)" = 9.14.1
          test "$(ghc-pkg --version)" = 'GHC package manager version 9.14.1'
          case "$(cabal --numeric-version)" in 3.16.*) ;; *) exit 1 ;; esac
          python3 - <<'PY'
          import os
          from pathlib import Path
          release = dict(line.split('=', 1) for line in (Path(os.environ['JAVA_HOME']) / 'release').read_text().splitlines() if '=' in line)
          assert release['GRAALVM_VERSION'].strip('"') == '25.3.4.1', release.get('GRAALVM_VERSION')
          assert release['JAVA_VERSION'].strip('"').split('.')[0] == '25', release.get('JAVA_VERSION')
          PY
          java --version
      - name: Check the primop checklist
        run: |
          cabal run exe:thc-primops -- coverage --check
          cabal run exe:thc-primops -- scalars
          # Cabal's pre-test setup resolves sibling libraries from the combined plan.
          # Register them before any suite starts, including on a clean build.
          cabal build test:primop-tools test:compact-core-tests -fdevelopment
          cabal test primop-tools compact-core-tests -fdevelopment --test-show-details=direct
      - name: Resolve Cabal driver dependencies
        run: cabal build exe:thc
      - name: Install Linux native and LLVM build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 llvm-18 libgmp-dev
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Install macOS LLVM build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
      - name: Check LLVM backend tools
        run: |
          for tool in clang llc opt llvm-nm llvm-link llvm-objcopy; do
            command -v "$tool"
            major=$("$tool" --version | sed -nE 's/.*version ([0-9]+).*/\1/p' | sed -n '1p')
            test "$major" = 18
          done
      - name: Check pinned guest protocol artifacts
        run: ./gradlew --no-daemon --max-workers=2 --continue testMaterializableApi testReturnPolicy testReturnContinuations
      - name: Build JVM distribution from source
        run: |
          bin/build-compiler.sh
          ./gradlew --no-daemon installDist toolsJar
      - name: Check original aggregate constructor fields against native GHC
        run: |
          cabal run exe:thc-fixtures --offline -- aggregate-heap
          cabal run exe:thc-fixtures --offline -- fourway-aggregate
          cabal run exe:thc-fixtures --offline -- generic-sum-transport
          cabal run exe:thc-fixtures --offline -- narrow-integer-transport
          ./gradlew aggregateHeapFullCoreTest aggregateHeapFullCoreDenseTest \
            fourwayAggregateFullCoreTest fourwayAggregateFullCoreDenseTest \
            genericSumTransportFullCoreTest genericSumTransportFullCoreDenseTest \
            narrowIntegerTransportFullCoreTest narrowIntegerTransportFullCoreDenseTest
      - name: Check tuple join arguments and bottoming tuple cases
        run: |
          cabal run exe:thc-fixtures --offline -- tuple-join --local
          ./gradlew tupleJoinFullCoreTest tupleJoinFullCoreDenseTest
      - name: Check original binary sum inputs and captures
        run: |
          cabal run exe:thc-fixtures --offline -- sum-input
          ./gradlew sumInputFullCoreTest sumInputFullCoreDenseTest
      - name: Check original binary sum join inputs and captures
        run: |
          cabal run exe:thc-fixtures --offline -- sum-join-input
          ./gradlew sumJoinInputFullCoreTest sumJoinInputFullCoreDenseTest
      - name: Check original tuple closure and thunk captures
        run: |
          cabal run exe:thc-fixtures --offline -- tuple-capture
          ./gradlew tupleCaptureFullCoreTest tupleCaptureFullCoreDenseTest
      - name: Check Haskell calls into JavaScript
        run: |
          python3 bin/test-polyglot-audit.py
          python3 -O bin/test-polyglot-audit.py
          bin/polyglot-demo.sh
          python3 bin/test-javascript-ffi.py
          bin/javascript-demo.sh
          ./gradlew polyglotTest
      - name: Build and exercise the Cabal driver
        shell: bash
        run: |
          set -euo pipefail
          cabal build exe:thc --offline -fdevelopment
          cabal run thc --offline -fdevelopment -- --help
          cabal test driver-tests cpu-affinity-api -fdevelopment --test-show-details=direct
      - name: Prepare fresh library source and native oracles
        run: python3 bin/prepare-library-tests.py
      - name: Package verified library inputs and installed runtime
        run: python3 .github/scripts/library_bundle.py pack --output build/library-transfer.tar.gz
      - name: Share this platform's library inputs with this Build attempt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: library-inputs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/library-transfer.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Check exact dependency auditor and library frontier
        run: |
          python3 bin/test-audit-core.py
          python3 bin/test-plugin.py
          python3 bin/test-core-enums.py
          python3 bin/test-sum-layout.py
          python3 bin/test-core-sums.py
          python3 bin/test-tuple-inputs.py
          python3 bin/test-empty-join-inputs.py
          python3 bin/test-library-frontier.py
          python3 bin/test-sequence-model.py
          python3 bin/test-core-vectors.py
          python3 bin/test-simd-families.py
          python3 bin/test-floatx4-model.py
          python3 bin/test-doublex2-model.py
          python3 bin/test-core-vector-memory.py
          python3 bin/test-core-word32-vector-memory.py
          python3 bin/test-core-float-vector-memory.py
          python3 bin/test-core-double-vector-memory.py
          python3 bin/test-core-bytearrays.py
          python3 bin/test-core-arrays.py
          python3 bin/test-address-fields.py
          python3 bin/test-core-data-tags.py
          python3 bin/test-show-int-model.py
          python3 bin/test-show-word-list-model.py
          python3 bin/test-narrow-literal-proofs.py
          python3 bin/test-short-bytes-slices-model.py
          python3 bin/test-array-slice-model.py
      - name: Check merged fixture and runtime recipes with and without assertions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            bin/test-build-cbits.py \
            bin/test-core-managed-memory.py \
            bin/test-core-managed-files.py \
            bin/test-core-md5-foreign.py \
            bin/test-core-package-manifest.py \
            bin/test-managed-mvar-fixtures.py \
            bin/test-managed-mvars.py \
            bin/test-prepare-managed-md5.py \
            bin/test-synchronous-exception-fixtures.py; do
            python3 "$test"
            python3 -O "$test"
          done
      - name: Check benchmark power provenance
        run: python3 tools/test-compare-map-runtimes.py
      - name: Prepare fresh Map source and native oracle
        env:
          THC_DIAGNOSTIC_UNSUPPORTED: 'true'
        run: bin/prepare-map.sh
      - name: Check diagnostic Map on both backends and handoff modes
        shell: bash
        run: |
          set -euo pipefail
          matrix_status=0
          for handoff in false true; do
            for backend in ast bytecode; do
              java --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED -Xss2m -XX:+UseCompactObjectHeaders \
                "-Dthc.backend=$backend" "-Dthc.handoffSlabs=$handoff" \
                -Dthc.diagnosticUnsupported=true -Dthc.traceCompilation=true \
                -cp 'build/install/thc/lib/*:build/diagnostics/thc-tools.jar' thc.MapCheck build/map/modules.txt build/map/oracle.tsv \
                2>&1 | tee "build/map/check-$backend-handoff-$handoff.log" || matrix_status=1
            done
          done
          exit "$matrix_status"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/
            build/original-stdio-read/logs/
