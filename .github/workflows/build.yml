name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit expected by the merge bot (empty for a manual run)
        type: string
        required: false

concurrency:
  group: build-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test merge decisions and race handling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Lint CI and merge workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/build.yml .github/workflows/merge.yml
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: '9.14.1'
          cabal-update: false
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          version: '25.3.4.1'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-for-updates: false
      - name: Verify pinned toolchain
        shell: bash
        run: |
          test "$(ghc --numeric-version)" = 9.14.1
          test "$(ghc-pkg --version)" = 'GHC package manager version 9.14.1'
          python3 - <<'PY'
          import os
          from pathlib import Path
          release = dict(line.split('=', 1) for line in (Path(os.environ['JAVA_HOME']) / 'release').read_text().splitlines() if '=' in line)
          assert release['GRAALVM_VERSION'].strip('"') == '25.3.4.1', release.get('GRAALVM_VERSION')
          assert release['JAVA_VERSION'].strip('"').split('.')[0] == '25', release.get('JAVA_VERSION')
          PY
          java --version
      - name: Build and test from source
        run: scripts/try.sh
      - name: Preserve default test results
        if: always()
        shell: bash
        run: |
          if [ -d build/test-results/test ]; then cp -R build/test-results/test build/test-results/default; fi
          if [ -d build/reports/tests/test ]; then cp -R build/reports/tests/test build/reports/tests/default; fi
      - name: Require fresh native SIMD oracle and post-Tidy export on x86
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('build/simd/provenance.json').read_text())
          assert proof['nativeRows'] == 147 and proof['stages'] == ['pre', 'post'], proof
          proof = json.loads(Path('build/simd-int32x4/provenance.json').read_text())
          assert proof['nativeRows'] == 243 and proof['stages'] == ['pre', 'post'], proof
          proof = json.loads(Path('build/simd-floatx4/provenance.json').read_text())
          assert proof['nativeRows'] == 2196 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          proof = json.loads(Path('build/simd-doublex2/provenance.json').read_text())
          assert proof['nativeRows'] == 3390 and proof['stages'] == ['pre', 'post'] and proof['positiveAuditsAccepted'], proof
          PY
      - name: Test opt-in dense handoff
        env:
          JAVA_TOOL_OPTIONS: -Dthc.handoffSlabs=true
        run: |
          scripts/gradle.sh --no-daemon test --rerun
          cp -R build/test-results/test build/test-results/handoff
          cp -R build/reports/tests/test build/reports/tests/handoff
      - name: Prepare fresh library source and native oracles
        run: python3 scripts/prepare-library-tests.py
      - name: Package verified library inputs and installed runtime
        run: python3 .github/scripts/library_bundle.py pack --output build/library-transfer.tar.gz
      - name: Share this platform's library inputs with this Build attempt
        uses: actions/upload-artifact@v7.0.1
        with:
          name: library-inputs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/library-transfer.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Check exact dependency auditor and library frontier
        run: |
          python3 scripts/test-audit-core.py
          python3 scripts/test-library-frontier.py
          python3 scripts/test-core-vectors.py
          python3 scripts/test-floatx4-model.py
          python3 scripts/test-doublex2-model.py
          python3 scripts/test-core-bytearrays.py
          python3 scripts/test-core-arrays.py
          python3 scripts/test-core-mutvars.py
          python3 scripts/test-int-array-model.py
          python3 scripts/test-double-array-model.py
          python3 scripts/test-primop-coverage.py
      - name: Check benchmark power provenance
        run: python3 tools/test-compare-map-runtimes.py
      - name: Prepare fresh Map source and native oracle
        env:
          THC_DIAGNOSTIC_UNSUPPORTED: 'true'
        run: scripts/prepare-map.sh
      - name: Check diagnostic Map on both backends and handoff modes
        shell: bash
        run: |
          set -euo pipefail
          matrix_status=0
          for handoff in false true; do
            for backend in ast bytecode; do
              java --enable-native-access=ALL-UNNAMED -Xss2m -XX:+UseCompactObjectHeaders \
                "-Dthc.backend=$backend" "-Dthc.handoffSlabs=$handoff" \
                -Dthc.diagnosticUnsupported=true -Dthc.traceCompilation=true \
                -cp 'build/install/thc/lib/*' thc.MapCheckKt build/map/modules.txt build/map/oracle.tsv \
                2>&1 | tee "build/map/check-$backend-handoff-$handoff.log" || matrix_status=1
            done
          done
          exit "$matrix_status"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/
            build/floating/core/
            build/floating/checks.json
            build/floating/oracle.tsv
            build/floating-tuple/
            build/empty-tuple-input/
            build/sqrt/
            build/test-results/
            build/aggregate-frontier.json
            build/primop-coverage.json
            build/scalar-signatures/provenance.json
            build/aggregate-native/oracle.tsv
            build/aggregate-layout/
            build/tuple-return/
            build/state-tuple/checks.json
            build/state-tuple/provenance.json
            build/state-tuple/oracle.tsv
            build/state-tuple/*-audit.json
            build/state-tuple/*-core/*.json
            build/mutvar/manifest.json
            build/mutvar/oracle.tsv
            build/mutvar/NativeMutVar.hs
            build/mutvar/*/*.audit.json
            build/mutvar/*/core/*.json
            build/boxed-arrays/
            build/bytearray/manifest.json
            build/bytearray/oracle.tsv
            build/bytearray/NativeByteArray.hs
            build/bytearray/*/*.audit.json
            build/bytearray/*/boot-provenance.json
            build/bytearray/*/core/*.json
            build/int-arrays/manifest.json
            build/int-arrays/oracle.tsv
            build/int-arrays/expected.tsv
            build/int-arrays/NativeIntArray.hs
            build/int-arrays/native/int-array-oracle
            build/int-arrays/*/*.audit.json
            build/int-arrays/*/*/core/*.json
            build/double-arrays/manifest.json
            build/double-arrays/oracle.tsv
            build/double-arrays/expected.tsv
            build/double-arrays/NativeDoubleArray.hs
            build/double-arrays/native/double-array-oracle
            build/double-arrays/*/*.audit.json
            build/double-arrays/*/*/core/*.json
            build/tuple-join/
            build/tuple-arithmetic/
            build/integer-primops/manifest.json
            build/integer-primops/oracle.tsv
            build/integer-primops/*.audit.json
            build/bit-primops/manifest.json
            build/bit-primops/oracle.tsv
            build/bit-primops/NativeBitPrimops.hs
            build/bit-primops/*-core/*.json
            build/bit-primops/*.audit.json
            build/simd/
            build/explicit64-primops/manifest.json
            build/explicit64-primops/oracle.tsv
            build/explicit64-primops/*.audit.json
            build/simd-int32x4/
            build/simd-floatx4/
            build/simd-doublex2/
            build/signed-narrow-primops/manifest.json
            build/signed-narrow-primops/oracle.tsv
            build/signed-narrow-primops/*.audit.json
            build/corpus/corpus.json
            build/corpus/oracle.tsv
            build/corpus/structure.json
            build/corpus/groups/**/*.audit.json
            build/corpus/groups/**/boot-provenance.json
            build/libraries/cases.json
            build/libraries/oracle.tsv
            build/libraries/oracle-validation.json
            build/libraries/check-*.log
            build/libraries/*/audit.json
            build/libraries/*/provenance.json
            build/map/audit.json
            build/map/check-*.log
            build/map/modules.txt
            build/map/oracle.tsv
            build/map/oracle-validation.json
            build/map/provenance.json
            build/map/reproduction-provenance.json

  library:
    name: library (${{ matrix.os }}, ${{ matrix.backend }}, handoff=${{ matrix.handoff }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [ast, bytecode]
        handoff: ['false', 'true']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          version: '25.3.4.1'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-for-updates: false
      - name: Download only this platform and Build attempt
        uses: actions/download-artifact@v8
        with:
          name: library-inputs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/library-download
          digest-mismatch: error
      - name: Verify source, platform, pinned JDK and original library fingerprints
        run: python3 .github/scripts/library_bundle.py restore --archive build/library-download/library-transfer.tar.gz
      - name: Run the complete strict and compiled library checks
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          HANDOFF: ${{ matrix.handoff }}
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" --enable-native-access=ALL-UNNAMED -Xss2m -XX:+UseCompactObjectHeaders \
            "-Dthc.handoffSlabs=$HANDOFF" -cp 'build/install/thc/lib/*' \
            thc.LibraryCheckKt build/libraries/cases.json "$BACKEND" \
            2>&1 | tee "build/libraries/check-$BACKEND-handoff-$HANDOFF.log"
      - name: Preserve each library mode's results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: library-results-${{ runner.os }}-${{ matrix.backend }}-handoff-${{ matrix.handoff }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/library-transfer-verified.json
            build/libraries/check-*.log
