name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:

# Let active publications finish; newer runs may replace pending work.
concurrency:
  group: docs-pages-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
      # Build, link-check and publish the exact main revision that triggered this run.
      DOCS_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
          ref: ${{ env.DOCS_REVISION }}
      - name: Verify documentation source revision
        run: test "$(git rev-parse HEAD)" = "$DOCS_REVISION"
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.0.0'
          cabal-update: true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cabal/store
            build/docs/cabal
            .gradle-user-home/caches
            .gradle-user-home/wrapper
            .gradle
          key: docs-v1-${{ runner.os }}-ghc9.14.1-jdk25-${{ hashFiles('thc.cabal', 'cabal.project', 'build.gradle', 'gradle.properties', 'nih/gradle/wrapper/gradle-wrapper.properties') }}
          # Reuse one snapshot per dependency/toolchain identity, not one per commit.
          # Cabal and Gradle validate restored inputs; make docs regenerates this revision.
          restore-keys: |
            docs-v1-${{ runner.os }}-ghc9.14.1-jdk25-${{ hashFiles('thc.cabal', 'cabal.project', 'build.gradle', 'gradle.properties', 'nih/gradle/wrapper/gradle-wrapper.properties') }}-
            docs-v1-${{ runner.os }}-ghc9.14.1-jdk25-
      # Javadoc compiles declarations against the same Jam API as the runtime.
      - uses: ./.github/actions/jam
      - name: Install Markdown renderer
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pandoc
      - name: Generate and validate documentation only
        run: make docs GRADLE_FLAGS='--no-daemon --build-cache'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v4
