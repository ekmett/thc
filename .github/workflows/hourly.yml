name: Hourly
on:
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected source commit (empty uses this run's commit)
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      cadence: hourly
      expected_sha: ${{ inputs.expected_sha || github.sha }}
