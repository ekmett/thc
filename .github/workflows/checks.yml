name: Shared checks
on:
  workflow_call:
    inputs:
      cadence:
        type: string
        required: true
      expected_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate cadence
        env:
          CI_CADENCE: ${{ inputs.cadence }}
        run: |
          case "$CI_CADENCE" in commit|hourly|nightly) ;; *) exit 1 ;; esac
      - name: Stop commit checks when Hourly is failing
        if: inputs.cadence == 'commit'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/hourly_health.py
      - name: Test merge decisions and race handling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Lint CI and merge workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-max-time 30 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # GitHub supports queue: max; the pinned linter does not yet know this key.
          "$RUNNER_TEMP/actionlint" -ignore '^unexpected key "queue" for "concurrency" section\.'
  jvm-linux:
    needs: automation
    name: Linux ordinary tests
    uses: ./.github/workflows/test-groups.yml
    with:
      os: ubuntu-latest
      expected_sha: ${{ inputs.expected_sha }}
      cadence: ${{ inputs.cadence }}
  jvm-macos:
    needs: automation
    name: macOS ordinary tests
    uses: ./.github/workflows/test-groups.yml
    with:
      os: macos-latest
      expected_sha: ${{ inputs.expected_sha }}
      cadence: ${{ inputs.cadence }}
  windows:
    needs: automation
    if: inputs.cadence == 'hourly'
    name: Windows tests
    uses: ./.github/workflows/windows.yml
    with:
      testGroup: Runtime
  build:
    needs: automation
    if: inputs.cadence == 'nightly'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Keep the existing cold preparation budget; test and compiler limits are unchanged.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.0.0'
          cabal-update: true
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          version: '25.3.4.1'
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-for-updates: false
      - name: Verify pinned toolchain
        shell: bash
        run: |
          test "$(ghc --numeric-version)" = 9.14.1
          test "$(ghc-pkg --version)" = 'GHC package manager version 9.14.1'
          case "$(cabal --numeric-version)" in 3.16.*) ;; *) exit 1 ;; esac
          python3 - <<'PY'
          import os
          from pathlib import Path
          release = dict(line.split('=', 1) for line in (Path(os.environ['JAVA_HOME']) / 'release').read_text().splitlines() if '=' in line)
          assert release['GRAALVM_VERSION'].strip('"') == '25.3.4.1', release.get('GRAALVM_VERSION')
          assert release['JAVA_VERSION'].strip('"').split('.')[0] == '25', release.get('JAVA_VERSION')
          PY
          java --version
      - name: Resolve Cabal driver dependencies
        run: cabal build exe:thc
      - name: Install Linux native and LLVM build dependencies
        if: runner.os == 'Linux' && inputs.cadence != 'commit'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 llvm-18 libgmp-dev
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Install macOS LLVM build dependencies
        if: runner.os == 'macOS' && inputs.cadence != 'commit'
        run: |
          brew install llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
      - name: Check LLVM backend tools
        if: inputs.cadence != 'commit'
        run: |
          for tool in clang llc opt llvm-nm llvm-link llvm-objcopy; do
            command -v "$tool"
            major=$("$tool" --version | sed -nE 's/.*version ([0-9]+).*/\1/p' | sed -n '1p')
            test "$major" = 18
          done
      - name: Build JVM distribution from source
        if: inputs.cadence != 'commit'
        run: |
          bin/build-compiler.sh
          ./gradlew --no-daemon installDist toolsJar
      - name: Check Haskell calls into JavaScript
        if: inputs.cadence == 'nightly'
        run: |
          python3 bin/test-polyglot-audit.py
          python3 -O bin/test-polyglot-audit.py
          bin/polyglot-demo.sh
          python3 bin/test-javascript-ffi.py
          bin/javascript-demo.sh
          ./gradlew polyglotTest
      - name: Compare public packages with native GHC on both backends and handoff modes
        if: inputs.cadence == 'nightly'
        run: cabal test driver-tests -fdevelopment --test-options=--public-packages-only --test-show-details=direct
      - name: Check cold project dependency acquisition
        if: inputs.cadence == 'nightly'
        run: cabal test driver-tests -fdevelopment --test-options=--acquire-project-only --test-show-details=direct
      - name: Prepare fresh library source and native oracles
        if: inputs.cadence == 'nightly'
        run: python3 bin/prepare-library-tests.py
      - name: Package verified library inputs and installed runtime
        if: inputs.cadence == 'nightly'
        run: python3 .github/scripts/library_bundle.py pack --output build/library-transfer.tar.gz
      - name: Share this platform's library inputs with this workflow attempt
        if: inputs.cadence == 'nightly'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: library-inputs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/library-transfer.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Prepare fresh Map source and native oracle
        if: inputs.cadence == 'nightly'
        env:
          THC_DIAGNOSTIC_UNSUPPORTED: 'true'
        run: bin/prepare-map.sh
      - name: Check diagnostic Map on both backends and handoff modes
        if: inputs.cadence == 'nightly'
        shell: bash
        run: |
          set -euo pipefail
          matrix_status=0
          for handoff in false true; do
            for backend in ast bytecode; do
              java --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED -Xss2m -XX:+UseCompactObjectHeaders \
                "-Dthc.backend=$backend" "-Dthc.handoffSlabs=$handoff" \
                -Dthc.diagnosticUnsupported=true -Dthc.traceCompilation=true \
                -cp 'build/install/thc/lib/*:build/diagnostics/thc-tools.jar' thc.MapCheck build/map/modules.txt build/map/oracle.tsv \
                2>&1 | tee "build/map/check-$backend-handoff-$handoff.log" || matrix_status=1
            done
          done
          exit "$matrix_status"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/
            build/test-results/
            build/libraries/cases.json
            build/libraries/oracle.tsv
            build/libraries/oracle-validation.json
            build/libraries/check-*.log
            build/libraries/*/audit.json
            build/libraries/sequence/*.audit.json
            build/libraries/*/provenance.json
            build/map/audit.json
            build/map/check-*.log
            build/map/modules.txt
            build/map/oracle.tsv
            build/map/oracle-validation.json
            build/map/provenance.json
            build/map/reproduction-provenance.json

  library:
    if: inputs.cadence == 'nightly'
    name: library (${{ matrix.os }}, ${{ matrix.backend }}, handoff=${{ matrix.handoff }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [ast, bytecode]
        handoff: ['false', 'true']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          version: '25.3.4.1'
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-for-updates: false
      - name: Download only this platform and workflow attempt
        uses: actions/download-artifact@v8
        with:
          name: library-inputs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/library-download
          digest-mismatch: error
      - name: Verify source, platform, pinned JDK and original library fingerprints
        run: python3 .github/scripts/library_bundle.py restore --archive build/library-download/library-transfer.tar.gz
      - name: Run the complete strict and compiled library checks
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          HANDOFF: ${{ matrix.handoff }}
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" --add-modules=jdk.incubator.vector --enable-native-access=ALL-UNNAMED -Xss2m -XX:+UseCompactObjectHeaders \
            "-Dthc.handoffSlabs=$HANDOFF" -cp 'build/install/thc/lib/*:build/diagnostics/thc-tools.jar' \
            thc.LibraryCheck build/libraries/cases.json "$BACKEND" \
            2>&1 | tee "build/libraries/check-$BACKEND-handoff-$HANDOFF.log"
      - name: Preserve each library mode's results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: library-results-${{ runner.os }}-${{ matrix.backend }}-handoff-${{ matrix.handoff }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/library-transfer-verified.json
            build/libraries/check-*.log
