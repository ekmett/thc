name: Native Windows smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A merged PR's close event keeps its PR group even when its ref becomes main.
  # Missing PR metadata stays in a run-specific PR group, never main's.
  group: native-windows-${{ github.event_name == 'pull_request' && (github.event.number || format('pr-{0}', github.run_id)) || github.ref }}
  # Finish active main checks; PR updates and close cancel their obsolete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Windows (${{ matrix.testGroup }})
    strategy:
      fail-fast: false
      matrix:
        testGroup: [Driver, Runtime]
    runs-on: windows-2025
    timeout-minutes: 45
    # Upstream submodules do not inherit the root .gitattributes file.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and test on native Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build | Out-Null
          $env:LLD_REPRODUCE = Join-Path $PWD 'build/windows-native-link.tar'
          & {
            . ./bin/bootstrap-windows.ps1 -Prefix "$env:RUNNER_TEMP/thc-tools"
            & ./bin/test-windows-python.ps1
            & ./bin/test-windows-cabal-config.ps1
            Invoke-ThcTool $env:CABAL @('update')
            & ./bin/windows.ps1 -Action Test -Jobs 4 -TestGroup '${{ matrix.testGroup }}'
          } *>&1 | Tee-Object build/windows-ci.log
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-windows-evidence-${{ matrix.testGroup }}
          if-no-files-found: warn
          path: |
            build/windows-ci.log
            build/windows-native-link.tar
            build/windows-smoke/
            build/windows-launcher/
            build/windows-driver/
            build/windows-bridge/
            build/windows-codepages/
            build/windows-directory/*.json
            build/windows-directory/*.cbd
            build/windows-directory/logs/
            build/generated/windows-directory-abi/
            build/generated/stdio-abi/
            build/native-addresses/
            build/native-malloc/
            build/*-arrays/
            build/tuple-arithmetic/
            build/test-results/testDefault/
            build/test-results/testDense/
            build/generated/cbits/
            build/test-results/windows*SmokeTest/
            build/reports/tests/windows*SmokeTest/
            dist-newstyle/**/test/*.log
