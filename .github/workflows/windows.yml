name: Native Windows smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.event.pull_request.number || github.ref }}
  # Let an active run finish even while manual integrations keep main moving.
  # GitHub retains the newest pending run for the same branch/PR.
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    # Upstream submodules do not inherit the root .gitattributes file.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and test on native Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:THC_PYTHON = (Get-Command python.exe).Source
          New-Item -ItemType Directory -Force build | Out-Null
          $env:LLD_REPRODUCE = Join-Path $PWD 'build/windows-native-link.tar'
          & {
            . ./bin/bootstrap-windows.ps1 -Prefix "$env:RUNNER_TEMP/thc-tools"
            Invoke-ThcTool $env:CABAL @('update')
            & ./bin/windows.ps1 -Action Test -Jobs 4
          } *>&1 | Tee-Object build/windows-ci.log
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-windows-evidence
          if-no-files-found: warn
          path: |
            build/windows-ci.log
            build/windows-native-link.tar
            build/windows-smoke/
            build/windows-launcher/
            build/windows-driver/
            build/windows-bridge/
            build/windows-codepages/
            build/libdw-unavailable/
            build/windows-directory/*.json
            build/windows-directory/logs/
            build/generated/windows-directory-abi/
            build/generated/stdio-abi/
            build/native-addresses/
            build/native-malloc/
            build/*-arrays/
            build/test-results/testDefault/
            build/test-results/testDense/
            build/managed-md5-native*/
            build/generated/cbits/
            build/test-results/windows*SmokeTest/
            build/reports/tests/windows*SmokeTest/
            dist-newstyle/**/test/*.log
