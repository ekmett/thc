name: Fast checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected checked-out commit (required to seed caches on main)
        type: string
        required: false
      base_sha:
        description: Comparison base (missing or invalid runs the full test set)
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: fast-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.trust.outputs.runner }}
      trusted: ${{ steps.trust.outputs.trusted }}
    steps:
      - name: Choose runner from the event before checking out code
        id: trust
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(os.environ['GITHUB_EVENT_PATH']) as stream:
              event = json.load(stream)

          def field(*parts):
              value = event
              for part in parts:
                  value = value.get(part) if isinstance(value, dict) else None
              return value

          repo = os.environ['GITHUB_REPOSITORY']
          kind = os.environ['GITHUB_EVENT_NAME']
          ref = os.environ['GITHUB_REF']
          trusted = False
          if field('repository', 'full_name') == repo:
              if kind == 'pull_request':
                  trusted = (field('pull_request', 'head', 'repo', 'full_name') == repo
                             and field('pull_request', 'head', 'repo', 'fork') is False
                             and field('pull_request', 'base', 'repo', 'full_name') == repo
                             and field('pull_request', 'base', 'ref') == 'main')
              elif kind == 'push':
                  trusted = ref == 'refs/heads/main'
              elif kind == 'workflow_dispatch':
                  trusted = ref.startswith('refs/heads/')
          runner = ['self-hosted', 'Linux', 'X64', 'thc-fast'] if trusted else 'ubuntu-24.04'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('runner=' + json.dumps(runner) + '\n')
              stream.write('trusted=' + str(trusted).lower() + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test automation and cache safety with assertions enabled and disabled
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -O -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Lint workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # GitHub supports queue: max; the pinned linter does not yet know this key.
          "$RUNNER_TEMP/actionlint" -ignore '^unexpected key "queue" for "concurrency" section\.'

  fast-check:
    needs: automation
    runs-on: ${{ fromJSON(needs.automation.outputs.runner) }}
    timeout-minutes: 60
    env:
      THC_GRADLE_USER_HOME: ${{ needs.automation.outputs.trusted == 'true' && '/home/ekmett/ai/thc-fast/cache/gradle' || format('{0}/.gradle-user-home', github.workspace) }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      FAST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
      FAST_HEAD_SHA: ${{ github.sha }}
      FAST_REPORT_DIR: build/fast/results/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Refuse foreign or unknown events on the persistent runner
        if: needs.automation.outputs.trusted == 'true'
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          import os

          with open(os.environ['GITHUB_EVENT_PATH']) as stream:
              event = json.load(stream)

          def field(*parts):
              value = event
              for part in parts:
                  value = value.get(part) if isinstance(value, dict) else None
              return value

          repo = os.environ['GITHUB_REPOSITORY']
          kind = os.environ['GITHUB_EVENT_NAME']
          ref = os.environ['GITHUB_REF']
          trusted = False
          if field('repository', 'full_name') == repo:
              if kind == 'pull_request':
                  trusted = (field('pull_request', 'head', 'repo', 'full_name') == repo
                             and field('pull_request', 'head', 'repo', 'fork') is False
                             and field('pull_request', 'base', 'repo', 'full_name') == repo
                             and field('pull_request', 'base', 'ref') == 'main')
              elif kind == 'push':
                  trusted = ref == 'refs/heads/main'
              elif kind == 'workflow_dispatch':
                  trusted = ref.startswith('refs/heads/')
          if not trusted:
              raise SystemExit('Persistent runner refuses a fork, foreign, or unknown event')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: ${{ needs.automation.outputs.trusted != 'true' }}
      - name: Start timing and verify the dispatched revision
        run: python3 .github/scripts/fast_ci.py start
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: needs.automation.outputs.trusted != 'true'
        with:
          python-version: '3.13'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        if: needs.automation.outputs.trusted != 'true'
        with:
          ghc-version: '9.14.1'
          cabal-update: false
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        if: needs.automation.outputs.trusted != 'true'
        with:
          version: '25.3.4.1'
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-for-updates: false
      - name: Identify toolchain and fixture dependencies
        run: python3 .github/scripts/fast_ci.py identify
      - name: Run fresh smoke plus affected tests
        run: python3 .github/scripts/fast_ci.py run
      - name: Report complete timings
        if: always()
        run: python3 .github/scripts/fast_ci.py finish
      - name: Retain commands, selected tests, fresh XML and failure output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FAST_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14
