name: Fast checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected checked-out commit (required to seed caches on main)
        type: string
        required: false
      base_sha:
        description: Comparison base (missing or invalid runs the full test set)
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: fast-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check dispatched revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -z "$EXPECTED_SHA" || test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test automation and cache safety with assertions enabled and disabled
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -O -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Lint workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # GitHub supports queue: max; the pinned linter does not yet know this key.
          "$RUNNER_TEMP/actionlint" -ignore '^unexpected key "queue" for "concurrency" section\.'

  fast-check:
    needs: automation
    runs-on: ubuntu-24.04
    # This is the warm ordinary-change gate. Compiler/ABI or unknown changes run
    # the full tests and may exceed the ordinary 2–3 minute target.
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
      THC_GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      FAST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
      FAST_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start timing and verify the dispatched revision
        run: python3 .github/scripts/fast_ci.py start
      - name: Restore pinned Graal and GHC installations
        id: toolchains
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          # Exact directories used by the pinned setup actions; not the entire
          # runner tool cache. GHCup recreates its bin links during setup.
          path: |
            ~/.ghcup/ghc/9.14.1
            ${{ runner.tool_cache }}/ghc/9.14.1
            ${{ runner.tool_cache }}/ghcup
            ${{ runner.tool_cache }}/graalvm-jdk-25.3.4.1_linux-x64_bin
          key: thc-fast-tools-v1-ubuntu24-X64-ghc9.14.1-graal25.3.4.1-${{ hashFiles('.github/workflows/fast.yml') }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: '9.14.1'
          cabal-update: false
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          version: '25.3.4.1'
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-for-updates: false
      - name: Identify actual toolchains and fixture dependencies
        id: identity
        run: python3 .github/scripts/fast_ci.py identify
      - name: Restore Gradle dependencies and Kotlin compilation outputs
        id: gradle
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          # The local build cache includes Kotlin/KAPT/Java task outputs. Never
          # restore build/test-results, reports, or an earlier successful check.
          path: |
            .gradle-user-home/caches
            .gradle-user-home/wrapper
          key: ${{ steps.identity.outputs.gradle-prefix }}-${{ github.sha }}
          restore-keys: ${{ steps.identity.outputs.gradle-prefix }}-
      - name: Restore native and Core input archive
        id: native
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: build/fast/native-inputs.tar.gz
          # No fallback prefix: byte-level source/toolchain validation follows.
          key: ${{ steps.identity.outputs.native-key }}
      - name: Validate inputs and run fresh smoke plus affected tests
        run: python3 .github/scripts/fast_ci.py run
      - name: Check trusted current-main cache publication
        id: publish
        run: python3 .github/scripts/fast_ci.py publish
      - name: Save pinned toolchains from successful current main
        if: steps.publish.outputs.allowed == 'true' && steps.toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.ghcup/ghc/9.14.1
            ${{ runner.tool_cache }}/ghc/9.14.1
            ${{ runner.tool_cache }}/ghcup
            ${{ runner.tool_cache }}/graalvm-jdk-25.3.4.1_linux-x64_bin
          key: ${{ steps.toolchains.outputs.cache-primary-key }}
      - name: Save Gradle compilation and dependency cache from successful current main
        if: steps.publish.outputs.allowed == 'true' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .gradle-user-home/caches
            .gradle-user-home/wrapper
          key: ${{ steps.gradle.outputs.cache-primary-key }}
      - name: Save verified native inputs from successful current main
        if: steps.publish.outputs.allowed == 'true' && steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: build/fast/native-inputs.tar.gz
          key: ${{ steps.native.outputs.cache-primary-key }}
      - name: Report complete timings and cache outcomes
        if: always()
        env:
          TOOLCHAIN_CACHE_HIT: ${{ steps.toolchains.outputs.cache-hit }}
          GRADLE_CACHE_HIT: ${{ steps.gradle.outputs.cache-hit }}
          NATIVE_CACHE_HIT: ${{ steps.native.outputs.cache-hit }}
        run: python3 .github/scripts/fast_ci.py finish
      - name: Retain commands, selected tests, fresh XML and failure output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/fast/results/
          if-no-files-found: warn
          retention-days: 14
