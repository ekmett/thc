name: Intensive
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected source commit (empty uses this run's commit)
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      cadence: nightly
      expected_sha: ${{ inputs.expected_sha || github.sha }}
