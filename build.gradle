def prepareProcessLifecycleOracle = tasks.register("prepareProcessLifecycleOracle") {
    def source = layout.projectDirectory.file("t/fixtures/process-lifecycle/Main.hs")
    def policySource = layout.projectDirectory.file("t/fixtures/process-lifecycle/sigchld-policy.c")
    def transportSource = layout.projectDirectory.file("src/main/c/native-process-api.c")
    def output = layout.buildDirectory.dir("process-lifecycle/native")
    def ghc = providers.environmentVariable("GHC").orElse("ghc")
    def clang = providers.environmentVariable("THC_CLANG").orElse("clang")
    inputs.file(source); inputs.property("ghc", ghc)
    inputs.file(policySource); inputs.file(transportSource); inputs.property("clang", clang); if (macHost) inputs.property("SDKROOT", nativeSdkRoot)
    outputs.dir(output)
    onlyIf { System.getProperty("os.name") == "Linux" && System.getProperty("os.arch") in ["amd64", "x86_64"] }
    doLast {
        def version = nativeExec { commandLine(ghc.get(), "--numeric-version") }.standardOutput.asText.get().trim()
        checkBuild(version == "9.14.1") { "Process oracle requires GHC 9.14.1, found $version" }
        def destination = output.get().asFile
        destination.mkdirs()
        nativeExec { commandLine(ghc.get(), "-O1", "-threaded", "-package", "process", "-package", "unix",
            "-outputdir", destination.path, source.asFile.path, "-o", destination.toPath().resolve("process-oracle").toFile().path) }.result.get()
        // Signal dispositions belong to this standalone control, never the test JVM.
        nativeExec { commandLine(clang.get(), "-std=c11", "-Wall", "-Wextra", "-Werror", "-O2",
            policySource.asFile.path, transportSource.asFile.path, "-Wl,--wrap=posix_spawn",
            "-o", destination.toPath().resolve("sigchld-policy").toFile().path) }.result.get()
    }
}
