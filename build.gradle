// Compile the unchanged pinned GHC cbits for this host. The resulting bitcode
// remains an optional execution path; no native pointer is exposed to Core.
// Homebrew Clang may default to an SDK removed during an Xcode upgrade.
// Keep an explicit caller SDK; otherwise use the SDK selected by xcode-select.
def macHost = System.getProperty("os.name").startsWith("Mac")
def nativeSdkRoot = providers.environmentVariable("SDKROOT").orElse(
    macHost ? providers.exec { commandLine("/usr/bin/xcrun", "--show-sdk-path") }.standardOutput.asText.map { it.trim() }
            : providers.provider { "" })
if (macHost) {
    tasks.withType(Test).configureEach {
        inputs.property("nativeSdkRoot", nativeSdkRoot)
        environment("SDKROOT", nativeSdkRoot.get())
    }
}
def nativeClang = providers.environmentVariable("THC_CLANG").orElse("clang")
def nativeExec = { Closure action ->
    providers.exec { spec ->
        if (macHost) spec.environment("SDKROOT", nativeSdkRoot.get())
        action.delegate = spec
        action.resolveStrategy = Closure.DELEGATE_FIRST
        action.call()
        if (macHost && spec.commandLine[0] == nativeClang.get()) {
            spec.commandLine([spec.commandLine[0], "--sysroot=${nativeSdkRoot.get()}"] + spec.commandLine.drop(1))
        }
    }
}
