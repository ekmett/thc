// Exact-width byte/short atomics, which JDK segment handles do not implement.
def compileNativeAtomics = tasks.register("compileNativeAtomics") {
    dependsOn("generateStdioAbi")
    def source = layout.projectDirectory.file("src/main/c/native-atomic-api.c")
    def stdio = layout.buildDirectory.file("generated/stdio-abi/thc/native/stdio-host-abi.json")
    def output = layout.buildDirectory.dir("generated/native-atomics")
    def clang = providers.environmentVariable("THC_CLANG").orElse("clang")
    inputs.file(source); inputs.file(stdio); inputs.property("clang", clang); if (macHost) inputs.property("SDKROOT", nativeSdkRoot)
    outputs.dir(output)
    doLast {
        def host = new JsonSlurper().parse(stdio.get().asFile) as Map
        def darwin = host["system"] == "Darwin" && host["architecture"] in ["x86_64", "aarch64"].toSet()
        if (host["system"] == "Linux" && host["architecture"] == "x86_64" || darwin) {
            def extension = darwin ? ".dylib" : ".so"
            def destination = output.get().asFile.toPath().resolve("thc/native/native-atomic-api$extension").toFile()
            destination.parentFile.mkdirs()
            def compiler = [clang.get()] + (darwin ? [] : ["--target=${host["target"]}"])
            nativeExec { commandLine(compiler + ["-std=c11", "-Wall", "-Wextra", "-Werror", "-O2",
                "-fPIC", darwin ? "-dynamiclib" : "-shared", source.asFile.path, "-o", destination.path]) }.result.get()
        }
    }
}
sourceSets.main { resources.srcDir(layout.buildDirectory.dir("generated/native-atomics")) }
tasks.processResources { dependsOn(compileNativeAtomics) }

