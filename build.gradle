// Probe the genuine Windows search-buffer ABI with the native target headers.
def generateWindowsDirectoryAbi = tasks.register("generateWindowsDirectoryAbi") {
    def source = layout.projectDirectory.file("src/main/c/windows-directory-abi.c").asFile
    def output = layout.buildDirectory.dir("generated/windows-directory-abi")
    def clang = providers.environmentVariable("THC_CLANG").orElse("clang")
    inputs.file(source)
    inputs.property("clang", clang); if (macHost) inputs.property("SDKROOT", nativeSdkRoot)
    inputs.property("host", System.getProperty("os.name") + "/" + System.getProperty("os.arch"))
    outputs.dir(output)
    onlyIf { windowsHost }
    doLast {
        def run = { List<String> command -> nativeExec { commandLine(command) }.standardOutput.asText.get() }
        def target = run([clang.get(), "-dumpmachine"]).trim()
        requireBuild(System.getProperty("os.arch") in ["amd64", "x86_64"].toSet() &&
            target.startsWith("x86_64-") && (target.contains("windows") || target.contains("mingw"))) {
            "Windows directory probing requires a native x86_64 Windows compiler: " + target
        }
        def executable = temporaryDir.toPath().resolve("windows-directory-abi.exe").toFile()
        run([clang.get(), "-std=c11", "-Wall", "-Wextra", "-Werror", source.path, "-o", executable.path])
        def probe = new JsonSlurper().parseText(run([executable.path])) as Map
        def document = ["schema": 1, "architecture": "x86_64", "target": target,
            "compilerVersion": run([clang.get(), "--version"]),
            "sourceSha256": MessageDigest.getInstance("SHA-256").digest(source.bytes)
                .encodeHex().toString(), "layout": probe]
        def destination = output.get().asFile.toPath().resolve("thc/native/windows-directory-abi.json").toFile()
        destination.parentFile.mkdirs()
        destination.setText(JsonOutput.prettyPrint(JsonOutput.toJson(document)) + "\n", "UTF-8")
    }
}
sourceSets.main { resources.srcDir(layout.buildDirectory.dir("generated/windows-directory-abi")) }
tasks.processResources { dependsOn(generateWindowsDirectoryAbi) }

// Original stdio FCalls use target C widths/errno, not JVM or private-ABI values.
def generateStdioAbi = tasks.register("generateStdioAbi") {
    def source = layout.projectDirectory.file(windowsHost ? "src/main/c/windows-stdio-abi-probe.c" : "src/main/c/stdio-abi-probe.c").asFile
    def output = layout.buildDirectory.dir("generated/stdio-abi")
    def clang = providers.environmentVariable("THC_CLANG").orElse("clang")
    inputs.file(source)
    inputs.property("clang", clang); if (macHost) inputs.property("SDKROOT", nativeSdkRoot)
    outputs.dir(output)
    outputs.upToDateWhen { false }
    doLast {
        def run = { List<String> command -> nativeExec { commandLine(command) }.standardOutput.asText.get() }
        def architecture = { String value ->
            def lower = value.toLowerCase(java.util.Locale.ROOT)
            lower == "amd64" ? "x86_64" : lower == "arm64" ? "aarch64" : lower
        }
        def osName = System.getProperty("os.name")
        def system = osName.startsWith("Mac") ? "Darwin" : windowsHost ? "Windows" : osName
        def arch = architecture(System.getProperty("os.arch"))
        def compiler = clang.get()
        def defaultTarget = run([compiler, "-dumpmachine"]).trim()
        def parts = defaultTarget.split('-').toList()
        requireBuild(system in ["Linux", "Darwin", "Windows"].toSet() && arch in (windowsHost ? ["x86_64"].toSet() : ["x86_64", "aarch64"].toSet()) &&
            parts.size() >= 3 && architecture(parts[0]) == arch &&
            (system == "Linux" ? parts.drop(2) == ["linux", "gnu"]
             : windowsHost ? parts.drop(2) == ["windows", "gnu"] : parts[2].startsWith("darwin"))) {
            "Stdio probing requires a native supported C compiler: $system/$arch, clang=$defaultTarget"
        }
        def target = system == "Linux" ? "$arch-unknown-linux-gnu" : defaultTarget
        def command = [compiler] + (system == "Linux" ? ["--target=$target"] : [])
        requireBuild(run(command + "-dumpmachine").trim() == target) { "Clang did not select the native stdio target $target" }
        def executable = new File(temporaryDir, windowsHost ? "stdio-abi-probe.exe" : "stdio-abi-probe")
        run(command + ["-std=c11", source.path, "-o", executable.path])
        def probe = new JsonSlurper().parseText(run([executable.path])) as Map
        requireBuild(probe.keySet() == (windowsHost ? ["widths", "errno", "seek"].toSet() : ["widths", "errno", "seek", "open", "at", "siginfoBytes"].toSet())) { "Malformed native stdio ABI probe" }
        // The C probe asserts widths; runtime Java validates all exact fields and errno values.
        def manifest = ["schema": (windowsHost ? 2 : 1), "system": system,
            "architecture": arch, "target": target, "compilerDefaultTarget": defaultTarget,
            "compilerVersion": run([compiler, "--version"]),
            "sourceSha256": MessageDigest.getInstance("SHA-256").digest(source.bytes)
                .encodeHex().toString(),
            "widths": probe["widths"], "errno": probe["errno"], "seek": probe["seek"]]
        if (windowsHost) manifest["profile"] = "windows-managed-descriptors"
        else { manifest["open"] = probe["open"]; manifest["at"] = probe["at"]; manifest["siginfoBytes"] = probe["siginfoBytes"] }
        def destination = output.get().asFile.toPath().resolve("thc/native/stdio-host-abi.json").toFile()
        destination.parentFile.mkdirs()
        destination.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + "\n", "UTF-8")
        logger.lifecycle("Probed original stdio ABI and errno values for $target")
    }
}
sourceSets.main { resources.srcDir(layout.buildDirectory.dir("generated/stdio-abi")) }
tasks.processResources { dependsOn(generateStdioAbi) }

