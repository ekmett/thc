buildscript {
    dependencies { classpath 'thc:build-logic' }
}

plugins {
    id "application"
}

tasks.named('wrapper') {
    jarFile = file('nih/gradle/wrapper/gradle-wrapper.jar')
}
repositories { mavenCentral() }

def windowsHost = System.getProperty("os.name").startsWith("Windows")
// Existing Python generators remain until their Haskell/Java migrations land.
def python = providers.environmentVariable("THC_PYTHON").orElse(windowsHost ? "python" : "python3")

// The pinned GHC signature table belongs to fixture/audit tooling, not runtime loading.
tasks.processResources { exclude("thc/scalar-primop-signatures.json") }
// The Windows runtime validates HSC receipts against the producer's same pinned catalog.
tasks.processResources { from("etc/ghc/9.14.1/windows-ghc-internal.json") { into("thc") } }
tasks.processResources {
    from("nih/licenses") {
        include("*.txt")
        into("META-INF/licenses")
    }
}

// Documentation uses handwritten declarations plus generated source resolution;
// it does not build native libraries or prepare Core/test fixtures.
def docsRevision = providers.gradleProperty("thc.docsRevision").orElse(
    providers.exec { commandLine("git", "rev-parse", "HEAD") }.standardOutput.asText.map { it.trim() })
// The checked family table generates typed nodes with fixed Vector API species.
// BytecodeRoot's DSL requires nested declarations; its marked regions are checked,
// never rewritten by a build. Refresh them explicitly with the generator --write.
def bytecodeCompilerSource = file("src/main/java/thc/runtime/BytecodeProgram.java")
def generateSimdFamilies = tasks.register("generateSimdFamilies", Exec) {
    inputs.files("bin/generate-simd-families.py", "bin/simd-families.json",
        "src/main/java/thc/runtime/BytecodeRoot.java", bytecodeCompilerSource)
    outputs.dir(layout.buildDirectory.dir("generated/simd"))
    commandLine(python.get(), "bin/generate-simd-families.py", "--check")
}
sourceSets.main { java.srcDir(layout.buildDirectory.dir("generated/simd/java")) }
def graalVersion = "25.3.4.1"
def stockTruffleOption = providers.gradleProperty("thc.stockTruffle").orElse("false").get()
requireBuild(stockTruffleOption in ["true", "false"]) { "thc.stockTruffle must be true or false" }
def stockTruffle = stockTruffleOption == "true"
if (!stockTruffle) {
    apply(from: "src/gradle/materializable-api.gradle")
    apply(from: "src/gradle/protocol-runtime.gradle")
}
// Additional languages are opt-in; the ordinary runtime stays language-neutral.
def polyglotDemoRuntime = configurations.create("polyglotDemoRuntime")
dependencies {
    implementation("org.graalvm.polyglot:polyglot:$graalVersion")
    implementation("org.graalvm.truffle:truffle-api:$graalVersion")
    // Affinity reset deliberately targets the pinned compiler-listener API.
    compileOnly("org.graalvm.truffle:truffle-runtime:$graalVersion")
    // Register local native providers in the pinned Sulong context's registry.
    compileOnly("org.graalvm.llvm:llvm-language:$graalVersion")
    runtimeOnly("org.graalvm.truffle:truffle-runtime:$graalVersion")
    runtimeOnly("org.graalvm.tools:dap-tool:$graalVersion")
    runtimeOnly("org.graalvm.polyglot:llvm-community:$graalVersion")
    annotationProcessor("org.graalvm.truffle:truffle-dsl-processor:$graalVersion")
    testAnnotationProcessor("org.graalvm.truffle:truffle-dsl-processor:$graalVersion")
    testImplementation("org.junit.jupiter:junit-jupiter:5.13.4")
    testImplementation("org.graalvm.truffle:truffle-runtime:$graalVersion")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    add(polyglotDemoRuntime.name, "org.graalvm.polyglot:js:$graalVersion")
}
if (!stockTruffle) apply(from: "src/gradle/windows-sulong.gradle")
if (stockTruffle) {
    def verifyStockTruffle = tasks.register("verifyStockTruffle") {
        group = "verification"
        description = "Check that the runtime uses the pinned upstream Truffle API, runtime and Sulong."
        inputs.files(configurations.runtimeClasspath)
        doLast {
            def artifacts = configurations.runtimeClasspath.files.collect { it.name }
            for (module in ["truffle-api", "truffle-runtime", "llvm-language"]) {
                checkBuild(artifacts.count { it == "${module}-${graalVersion}.jar" } == 1) {
                    "Expected exactly one upstream ${module} artifact"
                }
            }
            checkBuild(artifacts.every { !it.startsWith("thc-truffle-") && !it.startsWith("thc-llvm-language-") }) {
                "A patched runtime artifact remains on the stock classpath"
            }
        }
    }
    tasks.withType(Test).configureEach { dependsOn(verifyStockTruffle) }
    tasks.named("startScripts") { dependsOn(verifyStockTruffle) }
    tasks.named("check") { dependsOn(verifyStockTruffle) }
}
apply(from: "src/gradle/bytecode-metadata.gradle")
apply(from: "src/gradle/java-build-tests.gradle")
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

// Process original sources once. The five pinned generated-source transforms
// run in this task's doLast before final javac sees their output.
def processedMainSources = layout.buildDirectory.dir("generated/main/java")
def processedMainResources = layout.buildDirectory.dir("generated/main/processor-resources")
def processMainJava = tasks.register("processMainJava", JavaCompile) {
    dependsOn(generateSimdFamilies)
    source(fileTree("src/main/java") { include("**/*.java") })
    source(fileTree(layout.buildDirectory.dir("generated/simd/java")) { include("**/*.java") })
    classpath = sourceSets.main.compileClasspath
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs.add("-proc:only")
    options.generatedSourceOutputDirectory.set(processedMainSources)
    destinationDirectory.set(processedMainResources)
}
tasks.named("compileJava", JavaCompile) {
    dependsOn(processMainJava)
    source(processedMainSources)
    options.annotationProcessorPath = files()
    options.compilerArgs.add("-proc:none")
}
tasks.named("processResources") {
    dependsOn(processMainJava)
    from(processedMainResources) { exclude("**/*.class") }
}
tasks.named("javadoc", Javadoc) {
    dependsOn(processMainJava)
    source = fileTree("src/main/java") { include("**/*.java") }
    classpath = sourceSets.main.compileClasspath
    destinationDir = layout.buildDirectory.dir("docs/jvm").get().asFile
    options.encoding = "UTF-8"
    options.charSet = "UTF-8"
    options.docEncoding = "UTF-8"
    options.addStringOption("-add-modules", "jdk.incubator.vector")
    options.addStringOption("sourcepath", [file("src/main/java"), processedMainSources.get().asFile,
        layout.buildDirectory.dir("generated/simd/java").get().asFile].collect { it.path }.join(File.pathSeparator))
    options.addBooleanOption("notimestamp", true)
    options.linkSource = true
    inputs.property("docsRevision", docsRevision)
    doFirst {
        options.windowTitle = "THC JVM reference " + docsRevision.get().take(12)
        options.docTitle = "THC JVM reference"
        options.header = '<a href="https://github.com/ekmett/thc/tree/' + docsRevision.get() + '">Source ' + docsRevision.get().take(12) + '</a>'
    }
}
// Tests and benchmark controls can opt out explicitly; ordinary launches use compact headers.
def compactObjectHeaders = providers.gradleProperty("thc.compactObjectHeaders").orElse("true").get()
requireBuild(compactObjectHeaders == "true" || compactObjectHeaders == "false") { "thc.compactObjectHeaders must be true or false" }
def compactHeaderOption = "-XX:${compactObjectHeaders == "true" ? "+" : "-"}UseCompactObjectHeaders"
application {
    mainClass.set("thc.Main")
    applicationDefaultJvmArgs = ["--add-modules=jdk.incubator.vector", "--enable-native-access=ALL-UNNAMED", "--add-opens=java.base/java.lang=ALL-UNNAMED", "-Xss2m", compactHeaderOption] +
        // The Linux standalone guest owns GHC's supported process handlers.
        // Embedders do not inherit these launcher JVM arguments.
        (System.getProperty("os.name") == "Linux" ? ["-Xrs"] : [])
}
// An explicit oop or RAM-sizing choice belongs to the caller. In particular,
// forcing compressed oops can cap an otherwise explicit MaxRAMPercentage heap.
// Defer to opaque @argument files too, without opening or parsing them here.
def inheritedJvmOptions = ["JAVA_TOOL_OPTIONS", "JDK_JAVA_OPTIONS", "_JAVA_OPTIONS"]
def memoryOptionNames = ["UseCompressedOops", "MaxRAM", "MinRAM", "InitialRAM", "@"]
def defaultRuntimeOptions = { JavaForkOptions options ->
    def explicit = (options.jvmArgs ?: []) + inheritedJvmOptions.collect { options.environment[it]?.toString() ?: "" }
    def defaults = explicit.any { option -> memoryOptionNames.any { option.contains(it) } } ? [] : ["-XX:+UseCompressedOops"]
    if (!options.systemProperties.containsKey("jdk.graal.Vectorization") &&
        !explicit.any { it.contains("jdk.graal.Vectorization=") || it.contains("@") }) {
        defaults.add("-Djdk.graal.Vectorization=false")
    }
    return defaults
}
tasks.withType(JavaExec).configureEach { task ->
    jvmArgumentProviders.add({ defaultRuntimeOptions(task) } as CommandLineArgumentProvider)
}
tasks.withType(Test).configureEach { task ->
    jvmArgumentProviders.add({ defaultRuntimeOptions(task) } as CommandLineArgumentProvider)
}
tasks.startScripts {
    // This must happen before Java starts. HotSpot's suspend handler cannot be
    // chained behind the guest's USR2 handler; reserve Linux signal 64 for it.
    def policy = "case \"\$(uname -s)\" in\n  Linux)\n    if [ \"\${_JAVA_SR_SIGNUM+x}\" = x ] && [ \"\$_JAVA_SR_SIGNUM\" != 64 ]; then\n      die \"thc: Linux launcher requires _JAVA_SR_SIGNUM=64; incompatible setting was preserved\"\n    fi\n    _JAVA_SR_SIGNUM=64\n    export _JAVA_SR_SIGNUM\n    ;;\nesac\n"
    // Decide on the user's machine, not when the distribution is built. Java
    // reads JAVA_TOOL_OPTIONS and JDK_JAVA_OPTIONS before command-line defaults.
    def unixMemoryPolicy = "case \"\${JAVA_TOOL_OPTIONS-} \${JDK_JAVA_OPTIONS-} \${_JAVA_OPTIONS-} \${JAVA_OPTS-} \${THC_OPTS-}\" in\n  *UseCompressedOops*|*MaxRAM*|*MinRAM*|*InitialRAM*|*@*) ;;\n  *) DEFAULT_JVM_OPTS=\"\$DEFAULT_JVM_OPTS \\\"-XX:+UseCompressedOops\\\"\" ;;\nesac"
    // Query these variables rather than expanding their contents into cmd syntax:
    // an otherwise valid quoted -D property can contain shell metacharacters.
    def windowsMemoryPolicy = "(set JAVA_TOOL_OPTIONS & set JDK_JAVA_OPTIONS & set _JAVA_OPTIONS & set JAVA_OPTS & set THC_OPTS) 2>nul | \"%SystemRoot%\\System32\\findstr.exe\" /L /C:\"UseCompressedOops\" /C:\"MaxRAM\" /C:\"MinRAM\" /C:\"InitialRAM\" /C:\"@\" >nul\nif errorlevel 1 set DEFAULT_JVM_OPTS=%DEFAULT_JVM_OPTS% \"-XX:+UseCompressedOops\""
    def unixVectorPolicy = 'case "${JAVA_TOOL_OPTIONS-} ${JDK_JAVA_OPTIONS-} ${_JAVA_OPTIONS-} ${JAVA_OPTS-} ${THC_OPTS-}" in\n  *jdk.graal.Vectorization=*|*@*) ;;\n  *) DEFAULT_JVM_OPTS="$DEFAULT_JVM_OPTS \\"-Djdk.graal.Vectorization=false\\"" ;;\nesac'
    def windowsVectorPolicy = '(set JAVA_TOOL_OPTIONS & set JDK_JAVA_OPTIONS & set _JAVA_OPTIONS & set JAVA_OPTS & set THC_OPTS) 2>nul | "%SystemRoot%\\System32\\findstr.exe" /L /C:"jdk.graal.Vectorization=" /C:"@" >nul\nif errorlevel 1 set DEFAULT_JVM_OPTS=%DEFAULT_JVM_OPTS% "-Djdk.graal.Vectorization=false"'
    inputs.property("linuxSignalPolicy", policy)
    inputs.property("unixMemoryPolicy", unixMemoryPolicy)
    inputs.property("windowsMemoryPolicy", windowsMemoryPolicy)
    inputs.property("unixVectorPolicy", unixVectorPolicy)
    inputs.property("windowsVectorPolicy", windowsVectorPolicy)
    doLast {
        def unixMarker = "# Collect all arguments for the java command:"
        def unix = unixScript.getText("UTF-8")
        checkBuild(unix.contains(unixMarker)) { "Missing Gradle Unix launcher insertion point" }
        unixScript.setText(unix.replace(unixMarker, policy + "\n" + unixMemoryPolicy + "\n" + unixVectorPolicy + "\n\n" + unixMarker), "UTF-8")
        def windowsMarker = "@rem Execute thc"
        def windows = windowsScript.getText("UTF-8")
        checkBuild(windows.contains(windowsMarker)) { "Missing Gradle Windows launcher insertion point" }
        windowsScript.setText(windows.replace(windowsMarker, (windowsMemoryPolicy + "\n" + windowsVectorPolicy).replace("\n", "\r\n") + "\r\n\r\n" + windowsMarker), "UTF-8")
    }
}
tasks.named("run", JavaExec) {
    if (System.getProperty("os.name") == "Linux") doFirst {
        def setting = environment["_JAVA_SR_SIGNUM"]
        checkBuild(setting == null || setting == "64") { "Linux launcher requires _JAVA_SR_SIGNUM=64" }
        environment("_JAVA_SR_SIGNUM", "64")
    }
}
tasks.withType(Test).configureEach {
