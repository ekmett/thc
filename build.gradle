// These providers implement POSIX contracts, including LP64 CLong and termios.
// Windows must not publish guessed POSIX ABI receipts. Managed Core and portable
// original C resources are independent of these optional providers.
if (windowsHost) {
    ["generatePosixStatAbi", "generateTermiosAbi", "generateSigsetAbi",
        "compileNativeAtomics", "compileNativeFiles", "compileNativeDirectories", "compileNativeProcesses", "compileNativeOpenRequests", "compileNativeSignals", "compileNativeProcessSignals"]
        .each { name -> tasks.named(name) { onlyIf("POSIX provider is unavailable on Windows") { false } } }
    tasks.processResources {
        // Reject stale resources copied from a build for a different host, too.
        exclude { !it.isDirectory() && it.path.startsWith("thc/native/") &&
            it.path !in ["thc/native/windows-directory-abi.json", "thc/native/stdio-host-abi.json"].toSet() }
        exclude("thc/cbits/strerror*.bc", "thc/cbits/iconv.bc", "thc/cbits/*.so")
        exclude("thc/cbits/windows-malloc-probe.exe")
    }
} else {
    tasks.processResources { exclude("thc/native/windows-directory-abi.json") }
}

// Native Windows checkpoint: the default test task keeps its complete contract.
// Both tasks consume fresh thc-fixtures windows-smoke and native MD5 inputs.
[["windowsSmokeTest", false],[ "windowsDenseSmokeTest", true]].each { name, dense ->
    tasks.register(name, Test) {
        group = "verification"
        description = "Native-oracle runtime and C ABI smoke checks (dense handoff=$dense)."
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        systemProperty("thc.handoffSlabs", dense.toString())
        filter {
            ["thc.FastSmokeTest", "thc.RuntimeTest", "thc.BytecodeBackendTest",
                "thc.CoreRequestTest", "thc.FramesTest", "thc.CStringTest",
                "thc.runtime.ManagedMd5Test", "thc.WindowsDistributionTest",
                "thc.runtime.WindowsSulongLibraryLookupTest",
                "thc.runtime.NarrowReturnedPointerTest"].each { includeTestsMatching(it) }
        }
        inputs.files("build/windows-smoke/provenance.json", "build/windows-driver/provenance.json")
        dependsOn(tasks.installDist)
        maxParallelForks = 1
    }
}
tasks.named("windowsDenseSmokeTest") { mustRunAfter("windowsSmokeTest") }
