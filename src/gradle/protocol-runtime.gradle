import static thc.buildlogic.BuildChecks.*
import java.security.MessageDigest
import java.util.jar.JarFile

buildscript {
    dependencies { classpath "thc:build-logic" }
}

def protocolRuntimeVersion = "25.3.4.1"
def protocolRuntimeSource = configurations.create("protocolRuntimeSource") { canBeConsumed = false; transitive = false }
def protocolRuntimeBinary = configurations.create("protocolRuntimeBinary") { canBeConsumed = false; transitive = false }
def protocolRuntimeCompile = configurations.create("protocolRuntimeCompile") { canBeConsumed = false }
dependencies {
    add(protocolRuntimeSource.name, "org.graalvm.truffle:truffle-runtime:$protocolRuntimeVersion:sources")
    add(protocolRuntimeBinary.name, "org.graalvm.truffle:truffle-runtime:$protocolRuntimeVersion")
    add(protocolRuntimeCompile.name, "org.graalvm.truffle:truffle-runtime:$protocolRuntimeVersion")
    // The API is replaced by a file artifact, so declare its options/Polyglot compile input explicitly.
    add(protocolRuntimeCompile.name, "org.graalvm.polyglot:polyglot:$protocolRuntimeVersion")
}
def protocolRuntimeDigest = { byte[] bytes -> MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString() }
def requireRuntimeArchive = { File file, String hash ->
    checkBuild(protocolRuntimeDigest(file.bytes) == hash) { "Pinned Truffle runtime archive hash mismatch: ${file.name}" }
}
def prepareProtocolRuntime = tasks.register("prepareProtocolRuntime", Sync) {
    from(provider { zipTree(protocolRuntimeSource.singleFile) })
    include("com/oracle/truffle/runtime/OptimizedCallTarget.java", "com/oracle/truffle/runtime/OptimizedDirectCallNode.java",
        "com/oracle/truffle/runtime/EngineData.java", "com/oracle/truffle/runtime/BackgroundCompileQueue.java",
        "com/oracle/truffle/runtime/OptimizedTruffleRuntime.java",
        "com/oracle/truffle/runtime/BaseOSRRootNode.java", "com/oracle/truffle/runtime/OptimizedOSRLoopNode.java",
        "com/oracle/truffle/runtime/BytecodeOSRMetadata.java")
    into(layout.buildDirectory.dir("protocol-runtime/source"))
    inputs.files("tools/truffle-protocol/declared-return-runtime.patch", "tools/truffle-protocol/graph-budget-runtime.patch",
        "tools/truffle-protocol/terminal-target-runtime.patch", "tools/truffle-protocol/terminal-splitting-runtime.patch")
    doFirst {
        requireRuntimeArchive(protocolRuntimeSource.singleFile,
            "bc365db6f4765d57bc4779508dbe0fcdd2c379b4027eb954fd5b0c9e55c8a519")
    }
    doLast {
        providers.exec {
            workingDir(destinationDir)
            environment("GIT_CEILING_DIRECTORIES", destinationDir.parentFile.absolutePath)
            commandLine("git", "apply", "--no-index", file("tools/truffle-protocol/declared-return-runtime.patch").absolutePath)
        }.result.get().assertNormalExitValue()
        providers.exec {
            workingDir(destinationDir)
            environment("GIT_CEILING_DIRECTORIES", destinationDir.parentFile.absolutePath)
            commandLine("git", "apply", "--no-index", file("tools/truffle-protocol/graph-budget-runtime.patch").absolutePath)
        }.result.get().assertNormalExitValue()
        providers.exec {
            workingDir(destinationDir)
            environment("GIT_CEILING_DIRECTORIES", destinationDir.parentFile.absolutePath)
            commandLine("git", "apply", "--no-index", file("tools/truffle-protocol/terminal-target-runtime.patch").absolutePath)
        }.result.get().assertNormalExitValue()
        providers.exec {
            workingDir(destinationDir)
            environment("GIT_CEILING_DIRECTORIES", destinationDir.parentFile.absolutePath)
            commandLine("git", "apply", "--no-index", file("tools/truffle-protocol/terminal-splitting-runtime.patch").absolutePath)
        }.result.get().assertNormalExitValue()
        checkBuild(destinationDir.toPath().resolve("com/oracle/truffle/runtime/OptimizedCallTarget.java").toFile().getText("UTF-8")
            .contains("declaredReturnPolicyVersion")) { "Declared return runtime patch was not applied" }
    }
}
def compileProtocolRuntime = tasks.register("compileProtocolRuntime", JavaCompile) {
    source(prepareProtocolRuntime)
    include("**/*.java")
    classpath = files(tasks.named("materializableApiJar", Jar).flatMap { it.archiveFile }) + protocolRuntimeCompile
    destinationDirectory.set(layout.buildDirectory.dir("protocol-runtime/classes"))
    sourceCompatibility = "17"
    targetCompatibility = "17"
    // --release hides JVMCI; these are the pinned runtime's existing JVMCI inputs.
    options.compilerArgs.addAll(["-proc:none", "--add-modules=jdk.internal.vm.ci",
        "--add-exports=jdk.internal.vm.ci/jdk.vm.ci.meta=ALL-UNNAMED",
        "--add-exports=jdk.internal.vm.ci/jdk.vm.ci.code=ALL-UNNAMED",
        "--add-exports=jdk.internal.vm.ci/jdk.vm.ci.code.stack=ALL-UNNAMED",
        "--add-exports=jdk.internal.vm.ci/jdk.vm.ci.services=ALL-UNNAMED"])
}
def protocolRuntimeJar = tasks.register("protocolRuntimeJar", Jar) {
    group = "build"
    description = "Build the pinned runtime with an explicit per-root polymorphic completion declaration."
    archiveBaseName.set("thc-truffle-runtime")
    archiveVersion.set("$protocolRuntimeVersion-return1-budget1-aot1-terminal2")
    destinationDirectory.set(layout.buildDirectory.dir("protocol-runtime"))
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(compileProtocolRuntime.flatMap { it.destinationDirectory })
    from(provider { zipTree(protocolRuntimeBinary.singleFile) }) {
        exclude("com/oracle/truffle/runtime/OptimizedCallTarget.class", "com/oracle/truffle/runtime/OptimizedCallTarget\$*.class",
            "com/oracle/truffle/runtime/BaseOSRRootNode.class",
            "com/oracle/truffle/runtime/OptimizedOSRLoopNode*.class", "com/oracle/truffle/runtime/BytecodeOSRMetadata*.class",
            "com/oracle/truffle/runtime/OptimizedDirectCallNode.class", "com/oracle/truffle/runtime/OptimizedDirectCallNode\$*.class",
            "com/oracle/truffle/runtime/EngineData.class", "com/oracle/truffle/runtime/EngineData\$*.class",
            "com/oracle/truffle/runtime/BackgroundCompileQueue.class", "com/oracle/truffle/runtime/BackgroundCompileQueue\$*.class",
            "com/oracle/truffle/runtime/OptimizedTruffleRuntime.class", "com/oracle/truffle/runtime/OptimizedTruffleRuntime\$*.class", "META-INF/MANIFEST.MF")
    }
    from("tools/truffle-protocol/LICENSE-UPL.txt") { into("META-INF") }
    inputs.files(protocolRuntimeBinary)
    doFirst {
        requireRuntimeArchive(protocolRuntimeBinary.singleFile,
            "d74ff0b8eb9a5fec4a571f78bc21750ee41dfd454877b8cce8b33641efd90ae3")
        new JarFile(protocolRuntimeBinary.singleFile).withCloseable { jar ->
            manifest.attributes(jar.manifest.mainAttributes.collectEntries { key, value -> [(key.toString()): value.toString()] })
        }
        manifest.attributes(["Implementation-Title": "THC declared root completion Truffle runtime",
            "Implementation-Version": "$protocolRuntimeVersion-return1-budget1-aot1-terminal2",
            "Upstream-Source-SHA256": "bc365db6f4765d57bc4779508dbe0fcdd2c379b4027eb954fd5b0c9e55c8a519"])
    }
}
configurations.configureEach {
    if (name !in [protocolRuntimeSource.name, protocolRuntimeBinary.name, protocolRuntimeCompile.name].toSet()) {
        exclude(group: "org.graalvm.truffle", module: "truffle-runtime")
    }
}
dependencies {
    add("implementation", files(protocolRuntimeJar.flatMap { it.archiveFile }))
    // Preserve the upstream runtime POM dependency after replacing its binary with a file artifact.
    add("implementation", "org.graalvm.truffle:truffle-compiler:$protocolRuntimeVersion")
}
tasks.register("verifyProtocolRuntimeSelection") {
    group = "verification"
    dependsOn(protocolRuntimeJar, "verifyMaterializableApiSelection")
    doLast {
        def runtime = configurations.getByName("runtimeClasspath").files
        checkBuild(runtime.every { !(it.name == "truffle-runtime-${protocolRuntimeVersion}.jar") }) { "Stock runtime remains on runtime classpath" }
        def overlay = protocolRuntimeJar.get().archiveFile.get().asFile
        checkBuild(runtime.count { it.name == overlay.name } == 1) { "Expected exactly one declared runtime artifact" }
        def replaced = { String name -> name == "META-INF/MANIFEST.MF" ||
            name == "com/oracle/truffle/runtime/OptimizedCallTarget.class" ||
            ["EngineData", "BackgroundCompileQueue", "OptimizedTruffleRuntime", "OptimizedDirectCallNode"].any { base ->
                name == "com/oracle/truffle/runtime/${base}.class" || name.startsWith('com/oracle/truffle/runtime/' + base + '$')
            } ||
            name == "com/oracle/truffle/runtime/BaseOSRRootNode.class" ||
            name == "com/oracle/truffle/runtime/OptimizedOSRLoopNode.class" ||
            name.startsWith("com/oracle/truffle/runtime/OptimizedOSRLoopNode\$") ||
            name == "com/oracle/truffle/runtime/BytecodeOSRMetadata.class" ||
            name.startsWith("com/oracle/truffle/runtime/BytecodeOSRMetadata\$") ||
            name.startsWith("com/oracle/truffle/runtime/OptimizedCallTarget\$") }
        new JarFile(protocolRuntimeBinary.singleFile).withCloseable { stock ->
            new JarFile(overlay).withCloseable { declared ->
                def original = stock.entries().toList().findAll { !it.isDirectory() }.toList()
                def current = declared.entries().toList().findAll { !it.isDirectory() }.toList()
                checkBuild(current.collect { it.name }.toSet().minus(original.collect { it.name }.toSet())
                    .every { replaced(it) || it == "META-INF/LICENSE-UPL.txt" }) { "Unexpected added runtime payload" }
                for (entry in original.findAll { !(replaced(it.name)) }) {
                    def target = checkNotNull(declared.getJarEntry(entry.name)) { "Missing runtime entry: ${entry.name}" }
                    checkBuild(protocolRuntimeDigest(stock.getInputStream(entry).bytes) ==
                        protocolRuntimeDigest(declared.getInputStream(target).bytes)) { "Unrelated runtime entry changed: ${entry.name}" }
                }
                checkBuild(declared.manifest.mainAttributes.getValue("Multi-Release") == stock.manifest.mainAttributes.getValue("Multi-Release"))
                layout.buildDirectory.file("protocol-runtime/verified-artifact.sha256").get().asFile.setText(
                    protocolRuntimeDigest(overlay.bytes) + "  " + overlay.name + "\n" +
                    protocolRuntimeDigest(file("tools/truffle-protocol/declared-return-runtime.patch").bytes) + "  declared-return-runtime.patch\n" +
                    protocolRuntimeDigest(file("tools/truffle-protocol/graph-budget-runtime.patch").bytes) + "  graph-budget-runtime.patch\n" +
                    protocolRuntimeDigest(file("tools/truffle-protocol/terminal-target-runtime.patch").bytes) + "  terminal-target-runtime.patch\n" +
                    protocolRuntimeDigest(file("tools/truffle-protocol/terminal-splitting-runtime.patch").bytes) + "  terminal-splitting-runtime.patch\n" +
                    "Preserved upstream nonreplacement entries: " + original.count { !replaced(it.name) } + "\n", "UTF-8")
            }
        }
    }
}
tasks.named("check") { dependsOn("verifyProtocolRuntimeSelection") }

// One compiled control runs against matching stock and declared API/runtime binaries.
def returnPolicyMain = extensions.getByType(org.gradle.api.tasks.SourceSetContainer).named("main")
def returnPolicyRuntime = files(returnPolicyMain.map { it.output }, returnPolicyMain.map { it.runtimeClasspath })
def compileReturnPolicyControl = tasks.register("compileReturnPolicyControl", JavaCompile) {
    source("tools/truffle-protocol/tests/ReturnPolicyProbe.java")
    classpath = returnPolicyRuntime
    options.release.set(17)
    options.compilerArgs.add("-proc:none")
    destinationDirectory.set(layout.buildDirectory.dir("protocol-runtime/checks/classes"))
}
def returnPolicyModes = ["stock", "overlay"].collect { mode ->
    tasks.register("testReturnPolicy" + mode.capitalize(), JavaExec) {
        group = "verification"
        description = "Check explicit completion policy, unchanged arguments, AOT and public split against $mode binaries."
        dependsOn("verifyProtocolRuntimeSelection")
        def selectedApi = mode == "stock" ? files(configurations.getByName("materializableApiBinary")) : files(tasks.named("materializableApiJar", Jar).flatMap { it.archiveFile })
        def selectedRuntime = mode == "stock" ? files(protocolRuntimeBinary) : files(protocolRuntimeJar.flatMap { it.archiveFile })
        classpath = files(compileReturnPolicyControl.flatMap { it.destinationDirectory }) + selectedApi + selectedRuntime +
            returnPolicyRuntime.filter { !it.name.startsWith("thc-truffle-api-") && !it.name.startsWith("thc-truffle-runtime-") }
        mainClass.set("protocolprobe.ReturnPolicyProbe")
        args(mode)
        enableAssertions = true
        jvmArgs("--enable-native-access=ALL-UNNAMED", "--add-modules=jdk.incubator.vector")
        maxHeapSize = "1g"
    }
}
tasks.register("testReturnPolicy") { group = "verification"; dependsOn(returnPolicyModes) }
tasks.named("check") { dependsOn("testReturnPolicy") }

def compileReturnContinuationControl = tasks.register("compileReturnContinuationControl", JavaCompile) {
    source("tools/truffle-protocol/tests/ReturnContinuationRoot.java", "tools/truffle-protocol/tests/ReturnContinuationProbe.java")
    classpath = files(compileReturnPolicyControl.flatMap { it.destinationDirectory }) + returnPolicyRuntime
    options.annotationProcessorPath = configurations.annotationProcessor + returnPolicyRuntime
    options.release.set(21)
    options.compilerArgs.add("-proc:full")
    destinationDirectory.set(layout.buildDirectory.dir("protocol-runtime/checks/continuations"))
    options.generatedSourceOutputDirectory.set(layout.buildDirectory.dir("protocol-runtime/checks/generated"))
}
tasks.register("testReturnContinuations", JavaExec) {
    group = "verification"
    description = "Check actual generated first and nested yields, source splits and serialized return declarations."
    dependsOn("verifyProtocolRuntimeSelection")
    classpath = files(compileReturnContinuationControl.flatMap { it.destinationDirectory },
        compileReturnPolicyControl.flatMap { it.destinationDirectory }) + returnPolicyRuntime
    mainClass.set("protocolprobe.ReturnContinuationProbe")
    enableAssertions = true
    jvmArgs("--enable-native-access=ALL-UNNAMED", "--add-modules=jdk.incubator.vector")
    maxHeapSize = "1g"
}
tasks.named("check") { dependsOn("testReturnContinuations") }

def compileOsrSourceControl = tasks.register("compileOsrSourceControl", JavaCompile) {
    source("tools/truffle-protocol/tests/MaterializationProbe.java", "tools/truffle-protocol/tests/OsrSourceRootProbe.java")
    classpath = returnPolicyRuntime
    options.release.set(17)
    options.compilerArgs.add("-proc:none")
    destinationDirectory.set(layout.buildDirectory.dir("protocol-runtime/checks/osr-source"))
}
tasks.register("testOsrSourceOwnership", JavaExec) {
    group = "verification"
    description = "Check actual original/cloned loop and both bytecode OSR source-root identities."
    dependsOn("verifyProtocolRuntimeSelection")
    classpath = files(compileOsrSourceControl.flatMap { it.destinationDirectory }) + returnPolicyRuntime
    mainClass.set("protocolprobe.OsrSourceRootProbe")
    enableAssertions = true
    jvmArgs("--enable-native-access=ALL-UNNAMED", "--add-modules=jdk.incubator.vector")
    maxHeapSize = "1g"
}
tasks.named("check") { dependsOn("testOsrSourceOwnership") }

def compileOsrSchedulingControl = tasks.register("compileOsrSchedulingControl", JavaCompile) {
    source("tools/truffle-protocol/tests/OsrSchedulingProbe.java")
    classpath = returnPolicyRuntime
    options.release.set(17)
    options.compilerArgs.add("-proc:none")
    destinationDirectory.set(layout.buildDirectory.dir("protocol-runtime/checks/osr-scheduling"))
}
def testOsrScheduling = tasks.register("testOsrScheduling", JavaExec) {
    group = "verification"
    description = "Check real OSR first-winner publication, replacement and cancellation without holding the AST lock while waiting."
    dependsOn("verifyProtocolRuntimeSelection")
    classpath = files(compileOsrSchedulingControl.flatMap { it.destinationDirectory }) + returnPolicyRuntime
    mainClass.set("protocolprobe.OsrSchedulingProbe")
    enableAssertions = true
    jvmArgs("--enable-native-access=ALL-UNNAMED", "--add-modules=jdk.incubator.vector")
    maxHeapSize = "1g"
    timeout.set(java.time.Duration.ofSeconds(60))
}
tasks.named("check") { dependsOn(testOsrScheduling) }

def compileRuntimeLinkageControl = tasks.register("compileRuntimeLinkageControl", JavaCompile) {
    source("tools/truffle-protocol/tests/RuntimeLinkageProbe.java")
    classpath = files()
    options.release.set(17)
    options.compilerArgs.add("-proc:none")
    destinationDirectory.set(layout.buildDirectory.dir("protocol-runtime/checks/linkage"))
}
def testRuntimeLinkageConfiguration = tasks.register("testRuntimeLinkageConfiguration") {
    group = "verification"
    description = "Check deferred linkage tasks retain distinct arguments and exact stock/overlay artifacts."
    doLast {
        ["stock", "overlay"].each { expected ->
            def linkage = tasks.named("testRuntimeLinkage" + expected.capitalize(), JavaExec).get()
            checkBuild(linkage.args == [expected]) { "${linkage.name} selected arguments ${linkage.args}, expected $expected" }
            def expectedApi = expected == "stock" ? configurations.getByName("materializableApiBinary").singleFile :
                tasks.named("materializableApiJar", Jar).get().archiveFile.get().asFile
            def expectedRuntime = expected == "stock" ? protocolRuntimeBinary.singleFile : protocolRuntimeJar.get().archiveFile.get().asFile
            def paths = linkage.classpath.files
            checkBuild(paths.findAll { it.name.startsWith("truffle-api-") || it.name.startsWith("thc-truffle-api-") } == [expectedApi].toSet()) {
                "${linkage.name} selected the wrong API artifacts"
            }
            checkBuild(paths.findAll { it.name.startsWith("truffle-runtime-") || it.name.startsWith("thc-truffle-runtime-") } == [expectedRuntime].toSet()) {
                "${linkage.name} selected the wrong runtime artifacts"
            }
        }
    }
}
tasks.named("check") { dependsOn(testRuntimeLinkageConfiguration) }
tasks.named("testReturnPolicy") { dependsOn(testRuntimeLinkageConfiguration) }
["stock", "overlay"].each { mode ->
    def task = tasks.register("testRuntimeLinkage" + mode.capitalize(), JavaExec) {
        dependsOn("verifyProtocolRuntimeSelection")
        def api = mode == "stock" ? files(configurations.getByName("materializableApiBinary")) : files(tasks.named("materializableApiJar", Jar).flatMap { it.archiveFile })
        def runtime = mode == "stock" ? files(protocolRuntimeBinary) : files(protocolRuntimeJar.flatMap { it.archiveFile })
        classpath = files(compileRuntimeLinkageControl.flatMap { it.destinationDirectory }) + api + runtime +
            returnPolicyRuntime.filter { !it.name.startsWith("thc-truffle-api-") && !it.name.startsWith("thc-truffle-runtime-") }
        mainClass.set("protocolprobe.RuntimeLinkageProbe")
        args(mode)
        jvmArgs("--enable-native-access=ALL-UNNAMED", "--add-modules=jdk.incubator.vector")
        maxHeapSize = "512m"
    }
    tasks.named("testReturnPolicy") { dependsOn(task) }
}

// A failed physical target is never resubmitted; recovery publishes a different target.
def terminalTargetRuntime = configurations.getByName("runtimeClasspath")
def compileTerminalTargetControl = tasks.register("compileTerminalTargetControl", JavaCompile) {
    source("tools/truffle-protocol/tests/TerminalLanguage.java", "tools/truffle-protocol/tests/TerminalTargetProbe.java")
    classpath = terminalTargetRuntime
    options.annotationProcessorPath = configurations.annotationProcessor + terminalTargetRuntime
    options.release.set(17)
    options.compilerArgs.add("-proc:full")
    destinationDirectory.set(layout.buildDirectory.dir("protocol-runtime/checks/terminal-target"))
}
def terminalTargetControls = [false, true].collectMany { background ->
    ["options", "admission", "queued", "real", "osr", "split", "automatic", "splitlate"].collect { probe ->
        tasks.register("testTerminalTarget" + probe.capitalize() + (background ? "Background" : "Foreground"), JavaExec) {
            group = "verification"
            dependsOn("verifyProtocolRuntimeSelection")
            classpath = files(compileTerminalTargetControl.flatMap { it.destinationDirectory }) + terminalTargetRuntime
            mainClass.set("com.oracle.truffle.runtime.TerminalTargetProbe")
            args(probe, background.toString())
            enableAssertions = true
            jvmArgs("--enable-native-access=ALL-UNNAMED")
            maxHeapSize = "1g"
            timeout.set(java.time.Duration.ofSeconds(30))
        }
    }
}
tasks.register("testTerminalTarget") { group = "verification"; dependsOn(terminalTargetControls) }
tasks.named("check") { dependsOn("testTerminalTarget") }
