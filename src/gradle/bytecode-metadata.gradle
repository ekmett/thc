import thc.buildlogic.BytecodeNormalizers
import thc.buildlogic.BytecodeNormalizerChecks
import thc.buildlogic.BytecodeColdApplyPreparation
import thc.buildlogic.BytecodeColdDelimitedPreparation
import thc.buildlogic.BytecodeColdCompactPreparation
import thc.buildlogic.BytecodeColdPolyglotPreparation
import thc.buildlogic.BytecodeColdForcePreparation
import thc.buildlogic.BytecodeColdCapturePreparation
import thc.buildlogic.BytecodeColdBranchPreparation

buildscript {
    dependencies { classpath "thc:build-logic" }
}

// Normalize generated metadata before the final Java compilation.
def checks = [
    testBytecodeMetadataSplit: { task ->
        def path = providers.gradleProperty('thc.metadataFixture').orNull
        BytecodeNormalizerChecks.metadata(task.temporaryDir.toPath(), path == null ? null : file(path).toPath())
        logger.lifecycle('Argument metadata split: 192 opcode paths and invalid-opcode controls match; shape/version/idempotence controls passed.')
    },
    testBytecodeSourceModeAccessor: { task ->
        BytecodeNormalizerChecks.sourceMode(task.temporaryDir.toPath())
        logger.lifecycle('Source-mode accessor: compiled false/true controls, version/shape/newline/idempotence checks passed.')
    },
    testBytecodeStaticPreparation: { task ->
        BytecodeNormalizerChecks.staticPreparation()
        BytecodeNormalizerChecks.staticTags(task.temporaryDir.toPath())
        thc.buildlogic.BytecodeBudgetChoice.check()
        thc.buildlogic.BytecodeStackPreparation.check()
        thc.buildlogic.BytecodeMetadataPreparation.check()
        logger.lifecycle('Static cached-node/local metadata preparation: version, shape, clone, CRLF and idempotence controls passed.')
    },
    testBytecodeHandlerPreparation: { task ->
        BytecodeNormalizerChecks.handlers(task.temporaryDir.toPath())
        logger.lifecycle('Ordinary handler profiles: range/order/first-observation semantics, version/shape/CRLF/idempotence passed.')
    },
    testBytecodeColdApplyPreparation: { task ->
        BytecodeColdApplyPreparation.check()
        logger.lifecycle('Immutable Apply construction: exact body/operand/version, no state-bit writes, CRLF/idempotence/negative controls passed.')
    },
    testBytecodeColdDelimitedPreparation: { task ->
        BytecodeColdDelimitedPreparation.check()
        logger.lifecycle('Immutable delimited construction: exact body/operand/version, no state-bit writes, CRLF/idempotence/negative controls passed.')
    },
    testBytecodeColdCompactPreparation: { task ->
        BytecodeColdCompactPreparation.check()
        logger.lifecycle('Immutable compact construction: exact body/operand/version, no state-bit writes, CRLF/idempotence/negative controls passed.')
    },
    testBytecodeColdPolyglotPreparation: { task ->
        BytecodeColdPolyglotPreparation.check()
        logger.lifecycle('Immutable storage interop child: version/body/CRLF/idempotence/negative controls passed.')
    },
    testBytecodeColdForcePreparation: { task ->
        BytecodeColdForcePreparation.check(file('build/generated/main/java/thc/runtime/BytecodeRootGen.java').getText('UTF-8'))
        logger.lifecycle('Cold forcing: pinned adaptive body, immutable child, version/operand/CRLF/idempotence/negative controls passed.')
    },
    testBytecodeColdCapturePreparation: { task ->
        BytecodeColdCapturePreparation.check(file('build/generated/main/java/thc/runtime/BytecodeRootGen.java').getText('UTF-8'))
        logger.lifecycle('Cold capture ingress: pinned adaptive/typed body, read-only layout selection, version/operand/CRLF/idempotence/negative controls passed.')
    },
    testBytecodeColdBranchPreparation: { task ->
        def generated = file('build/generated/main/java/thc/runtime/BytecodeRootGen.java').getText('UTF-8')
        BytecodeColdBranchPreparation.check(generated)
        if (BytecodeNormalizers.all(generated, BytecodeNormalizers.VERSION) != generated)
            throw new IllegalStateException('Generated-source pipeline is not idempotent')
        logger.lifecycle('Cold branches: exact adaptive bodies, empty compiled profiles, version/target/clear/CRLF/idempotence/negative controls passed.')
    }
]
checks.each { name, runCheck ->
    tasks.register(name) {
        group = 'verification'
        if (name in ['testBytecodeColdForcePreparation', 'testBytecodeColdCapturePreparation', 'testBytecodeColdBranchPreparation']) dependsOn('processMainJava')
        if (name == 'testBytecodeMetadataSplit') {
            description = 'Check lossless, fail-closed splitting of generated Truffle instruction argument metadata.'
        } else if (name == 'testBytecodeSourceModeAccessor') {
            description = "Check the pinned generated builder's read-only lazy source-mode accessor."
        }
        inputs.files('src/gradle/bytecode-metadata.gradle', fileTree('src/build/java/thc/buildlogic'))
        doLast { runCheck(delegate) }
    }
}
tasks.named('check') { dependsOn(checks.keySet()) }

// Normalize proc:only output before the separate proc:none compilation. Keep
// all passes in their pinned order; none may be deferred until javac.
tasks.matching { it.name == 'processMainJava' }.configureEach {
    inputs.files('src/gradle/bytecode-metadata.gradle', fileTree('src/build/java/thc/buildlogic'))
    doLast {
        def dependencies = configurations.annotationProcessor.dependencies.findAll {
            it.group == 'org.graalvm.truffle' && it.name == 'truffle-dsl-processor'
        }
        if (dependencies.size() != 1 || dependencies[0].version == null) {
            throw new IllegalStateException('Expected exactly one pinned Truffle processor version')
        }
        def source = options.generatedSourceOutputDirectory.file('thc/runtime/BytecodeRootGen.java').get().asFile
        def before = source.getText('UTF-8')
        def after = BytecodeNormalizers.all(before, dependencies[0].version)
        if (before != after) source.setText(after, 'UTF-8')
    }
}
