import static thc.buildlogic.BuildChecks.*
import java.security.MessageDigest
import java.util.jar.JarFile

buildscript {
    dependencies { classpath "thc:build-logic" }
}

// One pinned Sulong artifact: declared mutable globals and root initialization
// on all hosts, plus optional cwd lookup on Windows. Keep the original task names.
def patchWindowsLocator = System.getProperty("os.name").startsWith("Windows")
def windowsSulongVersion = "25.3.4.1"
def sulongPolicyVersion = patchWindowsLocator ? "globals1-init1-windows1" : "globals1-init1"
def sulongReplacedClasses = ["com/oracle/truffle/llvm/runtime/global/LLVMGlobalContainer",
    "com/oracle/truffle/llvm/initialization/InitializeSymbolsNode",
    "com/oracle/truffle/llvm/initialization/LoadModulesNode"]
if (patchWindowsLocator) sulongReplacedClasses.add("com/oracle/truffle/llvm/parser/coff/WindowsLibraryLocator")
def replacedSulongEntry = { String name -> name == "META-INF/MANIFEST.MF" ||
    sulongReplacedClasses.any { name == it + ".class" || name.startsWith(it + '\u0024') } }
def windowsSulongSources = configurations.create("windowsSulongSources") { canBeConsumed = false; transitive = false }
def windowsSulongBinary = configurations.create("windowsSulongBinary") { canBeConsumed = false; transitive = false }
def windowsSulongCompile = configurations.create("windowsSulongCompile") { canBeConsumed = false }
dependencies {
    add(windowsSulongSources.name, "org.graalvm.llvm:llvm-language:$windowsSulongVersion:sources")
    add(windowsSulongBinary.name, "org.graalvm.llvm:llvm-language:$windowsSulongVersion")
    add(windowsSulongCompile.name, "org.graalvm.llvm:llvm-language:$windowsSulongVersion")
    add(windowsSulongCompile.name, "org.graalvm.polyglot:polyglot:$windowsSulongVersion")
}
def windowsSulongDigest = { byte[] bytes -> MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString() }
def requireWindowsSulongArchive = { File file, String hash ->
    checkBuild(windowsSulongDigest(file.bytes) == hash) { "Pinned Sulong archive hash mismatch: ${file.name}" }
}
def prepareWindowsSulong = tasks.register("prepareWindowsSulong", Sync) {
    from(provider { zipTree(windowsSulongSources.singleFile) })
    include("com/oracle/truffle/llvm/runtime/global/LLVMGlobalContainer.java",
        "com/oracle/truffle/llvm/initialization/InitializeSymbolsNode.java",
        "com/oracle/truffle/llvm/initialization/LoadModulesNode.java")
    if (patchWindowsLocator) include("com/oracle/truffle/llvm/parser/coff/WindowsLibraryLocator.java")
    into(layout.buildDirectory.dir("windows-sulong/source"))
    inputs.files("tools/sulong-globals/declared-mutability.patch",
        "tools/sulong-globals/initialization-latch.patch")
    if (patchWindowsLocator) inputs.file("tools/sulong-windows/optional-cwd.patch")
    doFirst {
        requireWindowsSulongArchive(windowsSulongSources.singleFile,
            "716562a9c6cbe9201f53bc972d9eafbb1a692a9d9aebb9f177a541c5e0913f66")
    }
    doLast {
        def patches = ["tools/sulong-globals/declared-mutability.patch",
            "tools/sulong-globals/initialization-latch.patch"]
        if (patchWindowsLocator) patches.add("tools/sulong-windows/optional-cwd.patch")
        for (patch in patches) {
            providers.exec {
                workingDir(destinationDir)
                environment("GIT_CEILING_DIRECTORIES", destinationDir.parentFile.absolutePath)
                commandLine("git", "apply", "--no-index", file(patch).absolutePath)
            }.result.get().assertNormalExitValue()
        }
    }
}
def compileWindowsSulong = tasks.register("compileWindowsSulong", JavaCompile) {
    source(prepareWindowsSulong)
    include("**/*.java")
    classpath = files(tasks.named("materializableApiJar", Jar).flatMap { it.archiveFile }) + windowsSulongCompile
    destinationDirectory.set(layout.buildDirectory.dir("windows-sulong/classes"))
    options.release.set(17)
    options.compilerArgs.add("-proc:none")
}
def windowsSulongJar = tasks.register("windowsSulongJar", Jar) {
    group = "build"
    description = "Build pinned Sulong with global mutability, root initialization and Windows optional cwd search."
    archiveBaseName.set("thc-llvm-language")
    archiveVersion.set("$windowsSulongVersion-$sulongPolicyVersion")
    destinationDirectory.set(layout.buildDirectory.dir("windows-sulong"))
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(compileWindowsSulong.flatMap { it.destinationDirectory })
    from(provider { zipTree(windowsSulongBinary.singleFile) }) {
        exclude { replacedSulongEntry(it.path) }
    }
    from("tools/sulong-windows/LICENSE-BSD.txt") { into("META-INF/licenses/sulong-windows") }
    inputs.files(windowsSulongBinary)
    doFirst {
        requireWindowsSulongArchive(windowsSulongBinary.singleFile,
            "c835fc80abdc818b7487c9e0b9ecd6c7cd59a7bbb7ac7041d6e2cda2be4b9335")
        new JarFile(windowsSulongBinary.singleFile).withCloseable { jar ->
            manifest.attributes(jar.manifest.mainAttributes.collectEntries { key, value -> [(key.toString()): value.toString()] })
        }
        manifest.attributes(["Implementation-Title": "THC Sulong global mutability and initialization",
            "Implementation-Version": "$windowsSulongVersion-$sulongPolicyVersion",
            "Upstream-Source-SHA256": "716562a9c6cbe9201f53bc972d9eafbb1a692a9d9aebb9f177a541c5e0913f66"])
    }
}
configurations.configureEach {
    if (name !in [windowsSulongSources.name, windowsSulongBinary.name, windowsSulongCompile.name].toSet()) {
        exclude(group: "org.graalvm.llvm", module: "llvm-language")
    }
}
dependencies {
    add("compileOnly", files(windowsSulongJar.flatMap { it.archiveFile }))
    add("runtimeOnly", files(windowsSulongJar.flatMap { it.archiveFile }))
    // Preserve the replaced binary's POM dependencies; truffle-api is already
    // supplied by the project's pinned materializable-API artifact.
    add("runtimeOnly", "org.graalvm.truffle:truffle-nfi:$windowsSulongVersion")
    add("runtimeOnly", "org.graalvm.shadowed:antlr4:$windowsSulongVersion")
    add("runtimeOnly", "org.graalvm.llvm:llvm-api:$windowsSulongVersion")
}
def verifyWindowsSulongSelection = tasks.register("verifyWindowsSulongSelection") {
    group = "verification"
    dependsOn(windowsSulongJar)
    doLast {
        def runtime = configurations.getByName("runtimeClasspath").files
        def patched = windowsSulongJar.get().archiveFile.get().asFile
        checkBuild(runtime.every { !(it.name == "llvm-language-${windowsSulongVersion}.jar") }) { "Stock Sulong remains on runtime classpath" }
        checkBuild(runtime.count { it == patched } == 1) { "Expected exactly one Sulong artifact" }
        def license = "META-INF/licenses/sulong-windows/LICENSE-BSD.txt"
        new JarFile(windowsSulongBinary.singleFile).withCloseable { stock ->
            new JarFile(patched).withCloseable { fixed ->
                def original = stock.entries().toList().findAll { !it.isDirectory() }.toList()
                def current = fixed.entries().toList().findAll { !it.isDirectory() }.toList()
                checkBuild(current.collect { it.name }.toSet() == original.collect { it.name }.toSet() + license) { "Unexpected Sulong payload" }
                for (entry in original.findAll { !replacedSulongEntry(it.name) }) {
                    checkBuild(java.util.Arrays.equals(stock.getInputStream(entry).withCloseable { it.bytes },
                        fixed.getInputStream(fixed.getJarEntry(entry.name)).withCloseable { it.bytes })) {
                        "Unexpected Sulong entry change: ${entry.name}"
                    }
                }
            }
        }
    }
}
tasks.withType(Test).configureEach { dependsOn(verifyWindowsSulongSelection) }
tasks.named("check") { dependsOn(verifyWindowsSulongSelection) }
