import static thc.buildlogic.BuildChecks.*

// Check the realized compilation contract without building native fixtures.
tasks.register('testJavaBuildPipeline') {
    group = 'verification'
    description = 'Check Java source processing, final compilation and test processor isolation.'
    doLast {
        def processing = tasks.findByName('processMainJava')
        checkBuild(processing instanceof JavaCompile) { 'Missing Java-only main source-processing stage' }
        def compilation = tasks.named('compileJava', JavaCompile).get()
        def testCompilation = tasks.named('compileTestJava', JavaCompile).get()
        checkBuild(processing.options.compilerArgs.contains('-proc:only')) { 'Main processing must not compile before normalization' }
        checkBuild(compilation.options.compilerArgs.contains('-proc:none')) { 'Main compilation must consume normalized sources without reprocessing' }
        checkBuild(!testCompilation.options.compilerArgs.contains('-proc:none')) { 'Test DSL/interop processing must remain enabled' }
        checkBuild(compilation.taskDependencies.getDependencies(compilation).contains(processing)) { 'Main compilation must follow processing and normalization' }
        checkBuild(processing.options.annotationProcessorPath.files == configurations.annotationProcessor.files) { 'Main processing lost the pinned processor' }
        checkBuild(!processing.options.annotationProcessorPath.empty) { 'Main processor path is empty' }
        checkBuild(!testCompilation.options.annotationProcessorPath.empty) { 'Test processor path is empty' }
        for (name in ['fullCoreTest', 'polyglotTest']) {
            def suite = sourceSets[name]
            def java = tasks.named(suite.compileJavaTaskName, JavaCompile).get()
            checkBuild(java.options.annotationProcessorPath.files == configurations.testAnnotationProcessor.files) { "Suite ${name} lost the pinned test processor" }
            checkBuild(suite.compileClasspath.files.containsAll(sourceSets.main.output.files)) { "Suite ${name} lost main output" }
            checkBuild(!java.options.compilerArgs.contains('-proc:none')) { "Suite ${name} must retain annotation processing" }
        }
        checkBuild(processing.javaCompiler.get().metadata.languageVersion.asInt() == 25 && compilation.javaCompiler.get().metadata.languageVersion.asInt() == 25) { 'Java toolchain must remain JDK 25' }
        def generated = processing.options.generatedSourceOutputDirectory.get().asFile
        checkBuild(!processing.source.files.any { it.toPath().startsWith(generated.toPath()) }) { 'Processing must not read its own generated output' }
        checkBuild(generated != processing.destinationDirectory.get().asFile) { 'Generated Java and processor resources need distinct outputs' }
        checkBuild(!plugins.hasPlugin('org.jetbrains.kotlin.jvm') && !plugins.hasPlugin('org.jetbrains.kotlin.kapt') && !plugins.hasPlugin('org.jetbrains.dokka')) { 'Java-only build retains a Kotlin plugin' }
        logger.lifecycle('Java pipeline: proc:only, isolated output, JDK 25, pinned processor, proc:none final compilation and independent test processing verified.')
    }
}
tasks.named('check') { dependsOn('testJavaBuildPipeline') }

tasks.register('verifyJavaRuntimeDependencies') {
    group = 'verification'
    description = 'Reject Kotlin runtime/compiler artifacts in application and test classpaths.'
    doLast {
        for (name in ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']) {
            def kotlin = configurations[name].resolvedConfiguration.resolvedArtifacts.findAll {
                it.moduleVersion.id.group.startsWith('org.jetbrains.kotlin')
            }
            checkBuild(kotlin.empty) { "Kotlin artifacts remain in ${name}: ${kotlin*.moduleVersion*.id}" }
        }
    }
}

tasks.register('verifyJavaOnlySources') {
    group = 'verification'
    description = 'Reject Kotlin sources, including tools, archives and generated output.'
    def sourceInventory = providers.exec {
        commandLine('git', 'ls-files', '-z', '--cached', '--others', '--exclude-standard', '--', '*.kt', '*.kts')
    }.standardOutput.asText
    doLast {
        def remaining = sourceInventory.get().split('\u0000').findAll { !it.empty && file(it).exists() }
        remaining.addAll(fileTree(layout.buildDirectory.dir('generated')) {
            include('**/*.kt', '**/*.kts')
        }.files.collect { it.path })
        checkBuild(remaining.empty) { "Kotlin sources are not supported:\n" + remaining.join('\n') }
    }
}

// Keep these existing native-backed graph controls compilable against the current
// runtime. This task neither prepares inputs nor executes a guest/benchmark.
tasks.register('compileRuntimeGraphProbes', JavaCompile) {
    source('bench/experiments/doublex2-bytearray/DoubleX2ByteArrayRuntimeGraphProbe.java',
        'bench/experiments/floatx4-bytearray/FloatX4ByteArrayRuntimeGraphProbe.java',
        'bench/experiments/int32x4-bytearray/Int32X4ByteArrayRuntimeGraphProbe.java',
        'bench/experiments/word32x4-bytearray/Word32X4ByteArrayRuntimeGraphProbe.java')
    dependsOn(tasks.named('compileJava'))
    classpath = files(tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }) + sourceSets.main.compileClasspath
    options.annotationProcessorPath = files()
    options.compilerArgs.add('-proc:none')
    destinationDirectory.set(layout.buildDirectory.dir('classes/runtime-graph-probes'))
}
tasks.named('check') { dependsOn('verifyJavaRuntimeDependencies', 'verifyJavaOnlySources', 'compileRuntimeGraphProbes') }
